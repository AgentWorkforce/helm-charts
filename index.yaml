  96bulls:
  - apiVersion: v2
    appVersion: 0.1.0
    created: "2026-10-29T04:48:48.197486515Z"
    dependencies:
    - alias: worker
      name: 96bulls-worker
      repository: file://../96bulls-worker
      version: 0.2.0
    - name: alleyoop
      repository: file://../alleyoop
      version: 0.2.0
    - alias: hoopdb
      condition: hoopdb.enabled
      name: cluster
      repository: https://cloudnative-pg.github.io/charts
      version: 0.9.0
    - alias: locker
      condition: locker.enabled
      name: minio
      repository: https://charts.min.io/
      version: 5.4.0
    - alias: otel
      condition: otel.enabled
      name: opentelemetry-collector
      repository: https://open-telemetry.github.io/opentelemetry-helm-charts
      version: 0.178.0
    description: 'The 96Bulls sessions pipeline in one release: the 96bulls-worker
      and alleyoop app charts, plus optional HoopDb (CloudNativePG Cluster), Locker
      (MinIO) and an OpenTelemetry collector. Hook-free, so `helm install` and Alchemy''s
      `helm template --no-hooks` + server-side apply behave the same. Requires the
      CloudNativePG operator when hoopdb.enabled (see deps/PINS.md). '
    digest: 365aed683e67be24112a3d8ad7c3025f0be5f212aab69ce14a078ee0cea21d6e
