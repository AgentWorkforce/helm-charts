# minio/minio 5.4.0, standalone, kind-only sizes. No buckets/users/policies:
# the chart's post-install bucket Job is a Helm hook (dropped under
# --no-hooks); 96bulls-worker's locker-init Job creates the bucket instead.
fullnameOverride: locker
mode: standalone
replicas: 1
existingSecret: locker-root
# MinIO no longer publishes public images (minio/minio and quay.io/minio
# both 404). Chainguard's image is public, signed and digest-pinned (free tier
# is :latest only, so pin the digest). Chainguard is the recommended production image too.
image:
  repository: cgr.dev/chainguard/minio
  tag: latest@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
persistence:
  enabled: false
resources:
  requests: { memory: 256Mi }
buckets: []
users: []
policies: []
svcaccts: []
consoleService: { type: ClusterIP }
