promotionProcedure:
  - order: 1
    action: close-source-license-and-revision-gaps
    gate: Every image has an exact committed revision and approved distribution terms.
  - order: 2
    action: build-in-reviewed-workflow
    gate: The workflow checks out the recorded revision and emits immutable digest, SBOM, provenance, and required platforms.
  - order: 3
    action: approve-vendor-release
    gate: Security, license, compatibility, and support reviews are recorded against the source revision and digest.
  - order: 4
    action: make-source-image-customer-accessible
    gate: Use an approved public vendor repository or a documented customer entitlement; never use the proof registry as the contract.
  - order: 5
    action: copy-by-digest-to-customer-registry
    gate: Copy from SOURCE@sha256 to the customer-owned repository, resolve the destination digest, and retain source-to-destination evidence.
  - order: 6
    action: verify-customer-copy
    gate: Verify pull access, required platforms, signatures/provenance, SBOM, scan result, and runtime compatibility from the customer registry.
  - order: 7
    action: update-customer-values
    gate: Pin the destination repository and digest; render and reject proof registries, private vendor-only references, mutable tags, or missing digests.

blockers:
  - id: IMG-BLOCK-001
    severity: hard
    images: [sessions-services]
    summary: The Sessions image is private and has no approved customer acquisition or promotion procedure.
    closeWhen:
      - customer-readable release or supported entitlement exists
      - required platforms and promoted digest are verified
  - id: IMG-BLOCK-002
    severity: hard
    images: [relayhistory]
    summary: RelayHistory is an experimental proof image with no supported container release/customer channel.
    closeWhen:
      - reviewed release workflow publishes from the recorded commit
      - approved customer channel and promotion evidence exist
  - id: IMG-BLOCK-003
    severity: hard
    images: [selfhost-api]
    summary: The API digest was built from uncommitted source, is amd64-only, and has no approved release workflow or customer channel.
    closeWhen:
      - complete source is committed and reviewed
      - release workflow publishes amd64 and arm64 from that commit
      - approved customer channel and promotion evidence exist
  - id: IMG-BLOCK-004
    severity: hard
    images: [relay-dashboard]
    summary: The Dashboard digest was built from uncommitted source and has no approved container release or customer channel.
    closeWhen:
      - exact proof source and workflow are committed and reviewed
      - a new image is built from that commit
      - approved customer channel and promotion evidence exist
  - id: IMG-REVIEW-001
    severity: review
    images: [sessions-migration-postgresql]
    summary: The public third-party digest is multi-arch and Apache-2.0, but its exact upstream source revision and release run are not recorded.
    closeWhen:
      - upstream digest-to-source revision and release evidence are recorded
