# Machine-readable image and source audit for the agent-relay GCP customer
# profile. This file records evidence; it is not an image approval list.
apiVersion: selfhost.agentrelay.com/v1alpha1
kind: CustomerImageSourceManifest
# Top-level per the gate schema (see the positive fixture in
# ci/customer-release-gate); the release gate refuses anything but "ready".
status: blocked
metadata:
  name: agent-relay-gcp
  auditedAt: "2026-11-04"
  chart:
    name: agent-relay
    version: 0.3.10
    values:
      - charts/agent-relay/values-gcp.yaml

scope:
  description: >-
    Unique images rendered by the full-customer GCP profile
    (charts/agent-relay/values-gcp.yaml) with all six product components
    enabled. Durable actors, Relayfile and Relayflows are optional preview
    components, off in this profile, and are not part of this matrix. Every
    row is the digest values-gcp.yaml renders.
  activeUniqueImages: 7
  excludedConditionalImages:
    - image: cgr.dev/chainguard/minio
      reason: sessions-pipeline.locker.enabled=false in the GCP profile
    - image: otel/opentelemetry-collector-contrib
      reason: sessions-pipeline.otel.enabled=false
    - image: docker.io/alpine/k8s
      reason: all three privileged SQL bootstrap Jobs are disabled
    - image: ghcr.io/cloudnative-pg/postgresql
      reason: >-
        The HoopDb Cluster is disabled, but this image is still active below
        as the Sessions migration wait-for-role init container.

policy:
  customerReadyRequires:
    - immutable digest in customer values
    - exact source repository and committed revision
    - approved source and binary distribution license
    - reviewed release workflow that builds the committed revision
    - required linux platform manifests
    - approved customer-accessible source registry or vendor promotion path
    - recorded SBOM, provenance, vulnerability review, and release approval
  proofRegistryIsCustomerChannel: false
  mutableTagsAllowedInCustomerValues: false
  unknownOrUnapprovedImageIsBlocking: true

