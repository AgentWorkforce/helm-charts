  - id: req.db.search-worker-role
    kind: requirement
    title: The session directory search Worker role (session_directory_search_worker)
    description: |
      NOLOGIN NOINHERIT NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION,
