      notes: engine 12.2.1 + the internal admin API (relaycast main bdf1b69c). Upgrade path from 0.1.0 is in charts/relaycast/README.md. Superseded by 0.3.0.
    - id: relaycast-0.1.0
      status: shipped
      charts: { relaycast: 0.1.0 }
      app_versions: { relaycast: 8.0.0 }
      images:
        relaycast: { repository: ghcr.io/agentworkforce/relaycast-self-host, digest: sha256:5c86c095a335259060dc34ce7aa2e90809267395af915977a1ae608f93a83b98 }
      notes: 'image 8.0.0; superseded by 0.2.0. ci/relaycast/smoke.sh upgrades from it.'
    - id: relayauth-0.1.2
      status: unreleased
      current: true
      charts: { relayauth: 0.1.2 }
      app_versions: { relayauth: 0.2.34 }
      images:
        relayauth: { repository: ghcr.io/agentworkforce/relayauth, digest: sha256:c23c92d25fdffef3b5838a1eef4c226925f859706365d9ccece229795b877288 }
      notes: License-annotation patch bump of 0.1.1.
    - id: relayauth-0.1.1
      status: shipped
      charts: { relayauth: 0.1.1 }
      app_versions: { relayauth: 0.2.34 }
      images:
        relayauth: { repository: ghcr.io/agentworkforce/relayauth, digest: sha256:c23c92d25fdffef3b5838a1eef4c226925f859706365d9ccece229795b877288 }
      notes: 'relayauth 784582ef (machine-bound History assertion contract, relayauth #113). Superseded by 0.1.2.'
    - id: relayauth-0.1.0
      status: shipped
      charts: { relayauth: 0.1.0 }
      app_versions: { relayauth: 0.2.32 }
      images:
        relayauth: { repository: ghcr.io/agentworkforce/relayauth, digest: sha256:eb71daa28e30eb7305f666d0bccc5a4002e53e8a574e3c4c32163d907a1b71df }
      notes: superseded by 0.1.1.
    - id: agent-relay-0.3.0
      status: unreleased
      current: true
      charts: { agent-relay: 0.3.0, relayhistory: 0.1.1, relay-cloud-api: 0.2.1, relay-dashboard: 0.1.0 }
      app_versions: { agent-relay: 0.1.0, relayhistory: 0.1.0, relay-cloud-api: 0.1.0, relay-dashboard: 0.1.0 }
      depends:
        agent-relay: { relaycast: 0.3.1, relayauth: 0.1.2, sessions-pipeline: 0.6.0, relayhistory: 0.1.1, relay-cloud-api: 0.2.1, relay-dashboard: 0.1.0, relayflows: 0.2.4, durable-actors: 0.14.6, relayfile: 0.2.0 }
