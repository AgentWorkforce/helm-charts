# Self-hosted requirements and options registry: the single source of truth for
# what a self-hosted operator must provide before installing (requirements) and
# what they can choose (options), per install profile, plus the chart/image/
# migration compatibility matrix.
#
# docs/self-hosted-requirements.md is generated from this file:
#   node ci/self-hosted-requirements/registry.mjs render
# CI (lint.yml, static job) runs `registry.mjs check`, which fails when this file
# and the charts disagree. See the README section "Self-hosted requirements
# registry" for how to add an entry.
#
# Entry fields:
#   id           req.<name> (kind requirement) or opt.<name> (kind option)
#   kind         requirement: must exist before install. option: a choice with a default.
#   title, description
#   chart        the chart (or list) whose values/templates the entry maps to
#   values       chart value paths. Umbrella paths (chart sessions-pipeline) under worker./alleyoop.
#                are the subcharts' paths. A trailing .* covers every path below it.
#   env          env vars the charts render for it
#   secrets      [{name, name_paths, keys: [{key, key_path}], note}]; name/key may be a
#                map by profile (default: the fallback). name_paths/key_path are resolved
#                in each listed profile's merged values (first non-empty wins) and must
#                equal name/key. A name starting with "<" is operator-chosen (not compared).
#   profiles     the profiles it applies to (see profiles: below)
#   status       shipped (charts implement it) | planned (no chart reads it yet; templates
#                must not reference its env or values)
#   provided_by  operator | chart | migrator | stack; a map by profile when it differs
#   default, choices (options only; a choice may carry status: planned)
#   profile_values  {profile: {path: value}}: values the profile must resolve to (checked)
#   verify       how to check it (string, or a map by profile)
#   sources      file:line refs in this repo; upstream refs are
#                sessions-pipeline@<sha>:<path>:<line> (sessions-pipeline was 96BullSessions)
schema: 1

overview: |
  Everything a self-hosted Agent Relay operator has to provide or decide, per
  install profile, generated from one registry. A **requirement** must exist
  before install (a Kubernetes Secret with exact keys, a database role or
  extension, a DNS name and certificate, workload identity, a cluster
  capability). An **option** is a choice with a default (database backend and
  mode, function boundary, ingress scheme, add-ons). Each entry says which chart
  values, env vars and Secret keys it maps to, who provides it in each profile,
  and how to verify it. CI keeps the registry, the charts and this page in step:
  every env var, Secret key and Secret-bearing value the templates use must be
  registered, every shipped entry must exist in the charts, planned entries must
  not be referenced by any template, and the compatibility matrix must equal
  the pinned digests.

profiles:
  # The sessions-pipeline umbrella profiles: charts/sessions-pipeline/profiles/*.yaml (shipped) and the
  # stack shapes CI renders (charts/sessions-pipeline/ci/*-values.yaml, ci/sessions-pipeline-profiles/matrix.sh).
  - id: selfhost-postgres
    title: New self-host install, in-cluster CloudNativePG HoopDb
    chart: sessions-pipeline
    values_file: profiles/selfhost-postgres.yaml
    services_image: ghcr
    db: { hoopdb: cnpg, db_mode: selfhosted, boundary: global-default-revoke }
    install: helm install sessions-pipeline agentworkforce/sessions-pipeline -f profiles/selfhost-postgres.yaml --set global.tenant.orgId=<org> --set alleyoop.auth.jwksUrl=<jwks url>
    summary: initdb creates the search Worker role; the runtime-role and function-default Jobs run as postgres before migrate on every deploy; in-cluster MinIO Locker.
  - id: migration
    title: Existing self-host release, in-cluster CloudNativePG HoopDb created before the search Worker role
    chart: sessions-pipeline
    values_file: profiles/migration.yaml
    services_image: ghcr
    db: { hoopdb: cnpg, db_mode: selfhosted, boundary: global-default-revoke }
    install: helm upgrade <existing release> agentworkforce/sessions-pipeline -f profiles/migration.yaml --set global.tenant.orgId=<org> --set alleyoop.auth.jwksUrl=<jwks url>
    summary: selfhost-postgres plus searchWorkerRole.bootstrapJob, because initdb never runs again on an existing cluster.
  - id: external-selfhosted
    title: External operator-controlled plain Postgres (RDS, your own Postgres 17) dedicated to HoopDb
    chart: sessions-pipeline
    values_file: profiles/external-selfhosted.yaml
    services_image: ghcr
    db: { hoopdb: external, db_mode: selfhosted, boundary: global-default-revoke }
    install: helm install sessions-pipeline agentworkforce/sessions-pipeline -f profiles/external-selfhosted.yaml --set global.tenant.orgId=<org> --set alleyoop.auth.jwksUrl=<jwks url> --set worker.migrations.runtimeRole=<role> --set worker.migrations.runtimeRoleLogin=<true|false>
    summary: No in-cluster SQL Jobs (the chart cannot exec into an external database); a superuser runs three bootstrap files first; migrate waits for the roles.
  - id: external-supabase
    title: External Supabase project as HoopDb (fail-closed)
    chart: sessions-pipeline
    values_file: profiles/external-supabase.yaml
    services_image: ghcr
    db: { hoopdb: external, db_mode: supabase, boundary: event-trigger }
    install: helm install sessions-pipeline agentworkforce/sessions-pipeline -f profiles/external-supabase.yaml --set global.tenant.orgId=<org> --set alleyoop.auth.jwksUrl=<jwks url> --set supabaseActivation.hold=false
    summary: Held by supabaseActivation.hold until the pinned image is confirmed as the production-Supabase pin and the live Supabase activation steps are approved. No shim, no wait-for-role, no privileged Jobs.
  - id: aws-cnpg
    title: AWS EKS proof stage, in-cluster CNPG HoopDb, S3 Locker via Pod Identity
    chart: sessions-pipeline
    values_file: ci/aws-cnpg-values.yaml
    services_image: ecr
    db: { hoopdb: cnpg, db_mode: selfhosted, boundary: global-default-revoke }
    summary: The stacks/aws/eks.ts shape with hoopdb backend cnpg (isolated proof and sandbox stages only). ECR image, S3 bucket through EKS Pod Identity, bundled OTel collector.
  - id: aws-supabase
    title: AWS EKS, external Supabase HoopDb, S3 Locker via Pod Identity
    chart: sessions-pipeline
    values_file: ci/pod-identity-values.yaml
    services_image: ghcr
    db: { hoopdb: external, db_mode: supabase, boundary: null }
    summary: The stacks/aws/eks.ts shape with hoopdb backend external. supabase mode with no function boundary set, so migrate fails closed (function_boundary_unproven) until one is selected and installed.
  - id: gcp-cloudsql
    title: GKE + Google Cloud SQL, GCS Locker via Workload Identity
    chart: sessions-pipeline
    values_file: ci/gcp-cloudsql-values.yaml
    services_image: ghcr
    db: { hoopdb: external, db_mode: cloudsql, boundary: global-default-revoke }
    summary: The stacks/gcp/config.ts shape. cloudsql mode, shim off, roleBootstrap false, a separate migration-owner URL; the operator runs the Cloud SQL bootstrap files as the migration owner.
  # The other self-host charts: one install shape each.
  - id: relaycast
    title: Relaycast core (portable-single)
    chart: relaycast
    install: helm install relaycast agentworkforce/relaycast --set baseUrl=https://relay.example.com --set existingSecret=relaycast-secrets
    summary: One replica, SQLite and local file storage on a retained PVC, Recreate upgrades. The required core of the self-hosted product.
  - id: relayauth
    title: RelayAuth issuer
    chart: relayauth
    install: helm install relayauth agentworkforce/relayauth --set existingSecret=relayauth-secrets
    summary: Single-writer SQLite issuer with externally managed signing keys and an optional JWKS-only ingress. Its JWKS URL is what alleyoop and relayfile verify against.
  - id: relayhistory
    title: Relay History data plane
    chart: relayhistory
    values_file: ci/default-values.yaml
    install: helm install relayhistory agentworkforce/relayhistory -f values.yaml --set image.digest=sha256:<digest>
    summary: Single-replica GCP proof shape backed by operator-managed PostgreSQL 17; no HA claim.
  - id: relay-cloud-api
    title: Self-host control-plane API
    chart: relay-cloud-api
    values_file: ci/default-values.yaml
    install: helm install relay-cloud-api agentworkforce/relay-cloud-api -f values.yaml --set image.digest=sha256:<digest>
    summary: Single-replica self-host API with normal migration Job and existing Secrets only; no HA claim.
  - id: relay-dashboard
    title: Self-host dashboard
    chart: relay-dashboard
    values_file: ci/default-values.yaml
    install: helm install relay-dashboard agentworkforce/relay-dashboard -f values.yaml --set image.digest=sha256:<digest>
    summary: Static dashboard whose ingress sends same-origin /cloud/api to relay-cloud-api.
  - id: agent-relay
    title: GCP messaging and Sessions suite
    chart: agent-relay
    values_file: [values-gcp-proof.yaml, values-gcp-proof-live.yaml, ci/gcp-proof-values.yaml]
    install: helm install agent-relay agentworkforce/agent-relay -f values-gcp-proof.yaml -f values-gcp-proof-live.yaml --set relay-cloud-api.image.digest=sha256:<digest>
    summary: Relaycast, RelayAuth, Sessions Pipeline, Relay History, control-plane API and dashboard; Relayflows is opt-in via components.relayflows, Relayfile is excluded.
  - id: relayfile
    title: Relayfile server
    chart: relayfile
    install: helm install relayfile agentworkforce/relayfile --set secrets.existingSecret=relayfile-secrets --set auth.jwksUrl=<jwks url>
    summary: Go server, Postgres-backed in production. Inclusion in the self-host product is unresolved (docs/self-hosted-reference-architecture.md).
  - id: relayflows
    title: Relayflows (standalone Job, or Cloud worker)
    chart: relayflows
    install: helm install relayflows agentworkforce/relayflows --set image.repository=<flow image> --set standalone.flow.path=<flow>
    summary: Off by default in the product. standalone runs a flow in a Kubernetes Job with no Agent Relay Cloud contact; cloudWorker enrolls a Cloud worker.

  - id: durable-actors
    title: TerseAI durable-actors control plane (vendored upstream chart)
    chart: durable-actors
    values_file: ci/gcp-values.yaml
    install: enabled through the agent-relay umbrella (components.durableActors); upstream publishes the chart itself
    summary: GKE Sandbox (gVisor) actor hosts, one Standard GCS bucket (Rapid optional), PostgreSQL; more than one controller needs Redis. Only GKE Sandbox and Modal providers exist upstream.
  - id: relaycast-durable-actors
    title: Relaycast on durable-actors (runtime.backend=durable-actors)
    chart: relaycast
    values_file: ci/durable-actors-values.yaml
    install: helm install relaycast agentworkforce/relaycast -f values.yaml (runtime.backend=durable-actors, a durable-actors control plane, ar_ credentials)
    summary: Stateless gateway (relaycast-actors-gateway) in front of one Workspace actor per workspace; deployer Job registers the actor bundle; files in GCS or S3. Fresh-install backend; SQLite workspaces are not migrated.
  - id: relayfile-durable-actors
    title: Relayfile on durable-actors (runtime.backend=durable-actors)
    chart: relayfile
    values_file: ci/durable-actors-values.yaml
    install: helm install relayfile agentworkforce/relayfile -f values.yaml (runtime.backend=durable-actors, a durable-actors control plane)
    summary: Stateless gateway, internal session broker (the only long-running holder of the admin api-key), deploy Job; file bytes in GCS or S3.
  - id: agent-relay-durable-actors
    title: GCP proof suite with the durable-actors control plane, Relaycast and Relayfile in actor mode
    chart: agent-relay
    values_file: [values-gcp-proof.yaml, values-gcp-proof-live.yaml, values-gcp-proof-durable-actors.yaml, values-gcp-proof-relayfile.yaml, ci/gcp-proof-values.yaml]
    install: helm upgrade agent-relay agentworkforce/agent-relay -f values-gcp-proof.yaml -f values-gcp-proof-live.yaml -f values-gcp-proof-durable-actors.yaml -f values-gcp-proof-relayfile.yaml
    summary: components.durableActors and components.relayfile on the GKE proof cluster; actors and files hosts on the suite load balancer. All proof image digests are pinned in the overlays (no --set).
# charts/sessions-pipeline/ci/*-values.yaml rendered by ci/sessions-pipeline-profiles/matrix.sh that are
# test variants of a profile above, not install shapes of their own.
ci_only_values:
  - file: ci/default-values.yaml
    why: selfhost-postgres with CI tenant values.
  - file: ci/kind-values.yaml
    why: selfhost-postgres on kind (local JWKS, pullPolicy Never, small volumes).
  - file: ci/search-worker-bootstrap-values.yaml
    why: migration (existing cluster) with CI tenant values.

