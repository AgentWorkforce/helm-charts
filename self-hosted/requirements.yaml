        relay-cloud-api: { repository: ghcr.io/agentworkforce/selfhost-api, digest_required: true }
        relay-dashboard: { repository: ghcr.io/agentworkforce/relay-dashboard, digest_required: true }
      notes: 'agent-relay 0.3.0 renames the Sessions subchart values key from 96bulls: to sessions-pipeline: (move your overrides; resource names under the umbrella are unchanged). relay-cloud-api 0.2.0 renders the relaycontrol contract (encryption.keyId required; internal token, dashboardUrl, flows, telemetry off by default). The GKE ingress denies /internal on the api host and gives the api backend a BackendConfig timeout (default 3600s) for the flows queue SSE stream. Supersedes the never-released 0.1.0. GKE proof packaging. Live proof pins (values-gcp-proof-live.yaml): dashboard sha256:23361e08b899f272ed5debcbd4e7d6c6555591029357d6fba6c54236063bca62 (relay-dashboard 53d484b); experimental unsupported RelayHistory sha256:72a057c27edbec53412a2b3a665913810b5d9a95d8b6b818946f1892590147bf (relayhistory-cloud 74a6e526, erasure fix). The CI render fixture and customer-images.yaml keep dashboard sha256:9bfc0c6b873411c7a0da60d746883bdef6aafd86a9b733c719500a603890b6fe and RelayHistory sha256:8fbda9bd89dd33994b6b3331fb403c38a25f04e6742050bd717e99661f3544ba. selfhost-api remains fail-closed until published and supplied by digest. The dashboard''s same-origin /cloud/api is served by selfhost-api natively (it owns /cloud/api and /login; no ingress rewrite). No HA claim. 0.2.0 adds optional components.durableActors (vendored durable-actors 0.14.6) and components.relayfile, both off by default. relayhistory 0.1.1 adds migrations.drainForWriteHold (two-step write-hold upgrade; the migrate Job waits until no History pod exists, README). relay-cloud-api 0.2.1: telemetry.level defaults to errors (scrubbed error metadata and health only; it takes effect once the install is registered with installId, install key and endpoint, so a default render stays off and a partial registration fails), telemetry.egressTo defaults to empty (restricted egress with https telemetry must list the ingest addresses), the standalone Ingress denies /internal when secretKeys.internalToken is set, and Helm 3.10+ is required. 0.2.1 moves to sessions-pipeline 0.5.5 (interim RelayAuth bearer stays off by default) and supersedes the never-released 0.2.0.'
    - id: relayfile-0.2.0
      status: unreleased
      current: true
      charts: { relayfile: 0.2.0 }
      app_versions: { relayfile: 0.1.0 }
      images:
        relayfile: { repository: ghcr.io/agentworkforce/relayfile }
      notes: 'License-annotation bump of 0.1.1 (unreleased 0.1.2) plus runtime.backend=durable-actors (gateway, session broker: ghcr.io/agentworkforce/relayfile-actors by digest; deploy Job and dev sidecar: relayfile-actors-workspace by digest). Go server image by tag (Chart.appVersion), not digest; default render unchanged.'
    - id: durable-actors-0.14.6
      status: unreleased
      current: true
      charts: { durable-actors: 0.14.6 }
      app_versions: { durable-actors: 0.14.6 }
      notes: 'Vendored TerseAI/durable-actors release chart v0.14.6 (tag commit 5f0a2d62, asset sha256 a489cd15...bee) with the local patches listed in charts/durable-actors/UPSTREAM.md (root global, invoke-only key, host idle timeout, pool-manager name length, zero-valued bounds, lowercase ingress host, schema patterns, README links). Never published by this repo; images pinned by upstream digest (charts/durable-actors/UPSTREAM.md).'

    - id: relayfile-0.1.1
      status: shipped
      charts: { relayfile: 0.1.1 }
      app_versions: { relayfile: 0.1.0 }
      images:
        relayfile: { repository: ghcr.io/agentworkforce/relayfile }
      notes: image by tag (Chart.appVersion), not digest. Superseded by 0.2.0.
    - id: relayflows-0.2.4
      status: unreleased
      current: true
      charts: { relayflows: 0.2.4 }
      app_versions: { relayflows: 2.0.50 }
      images:
        relayflows: { repository: node, tag: 22.23.3-bookworm-slim }
      notes: License-annotation patch bump of 0.2.3; the stock image installs the pinned relayflows runtime at start.
    - id: relayflows-0.2.3
      status: shipped
      charts: { relayflows: 0.2.3 }
      app_versions: { relayflows: 2.0.50 }
      images:
        relayflows: { repository: node, tag: 22.23.3-bookworm-slim }
      notes: the stock image installs the pinned relayflows runtime at start; production uses an immutable flow image. Superseded by 0.2.4.
  # Combinations the chart refuses at render time (the migrator refuses them too).
  refused_combos:
    - { db_mode: selfhosted, boundary: event-trigger, notes: event-trigger is supabase only }
    - { db_mode: cloudsql, boundary: event-trigger, notes: event-trigger is supabase only }
    - { db_mode: selfhosted, boundary: null, notes: functionBoundaryMode is required in selfhosted mode }
    - { db_mode: cloudsql, boundary: null, notes: functionBoundaryMode is required in cloudsql mode }
    - { db_mode: supabase, boundary: any, hoopdb: cnpg, notes: the in-cluster HoopDb is plain Postgres and needs selfhosted mode }
    - { db_mode: cloudsql, boundary: any, hoopdb: cnpg, notes: the in-cluster HoopDb needs selfhosted mode }

# Env the charts render that is neither a requirement nor an option.
internal_env:
  - { name: SERVICE, chart: [sessions-pipeline-worker, alleyoop], why: selects the entry point of the one services image }
  - { name: OTEL_SERVICE_NAME, chart: [sessions-pipeline-worker, alleyoop], why: equals SERVICE }
  - { name: TMPDIR, chart: [sessions-pipeline-worker, alleyoop], why: the writable emptyDir under a read-only root filesystem }
  - { name: HOME, chart: [sessions-pipeline, sessions-pipeline-worker, relayflows], why: a writable home under a read-only root filesystem }
  - { name: ROLES, chart: sessions-pipeline-worker, why: wait-for-role init container; derived from waitForRole.role and migrations.runtimeRole }
  - { name: FUNCTION_DEFAULT, chart: sessions-pipeline-worker, why: wait-for-role init container; derived from waitForRole.functionDefault }
  - { name: INTERVAL, chart: sessions-pipeline-worker, why: wait-for-role poll interval (waitForRole.intervalSeconds) }
  - { name: CLUSTER, chart: sessions-pipeline, why: privileged SQL Jobs; the CNPG cluster name (bootstrapJob.cluster) }
  - { name: DATABASE, chart: sessions-pipeline, why: privileged SQL Jobs; the HoopDb database (bootstrapJob.database) }
  - { name: INGEST_PORT, chart: alleyoop, why: from ingest.port }
  - { name: PORT, chart: [relaycast, relayauth], why: from server.port }
  - { name: RELAYCAST_DB_PATH, chart: relaycast, why: fixed /data/relaycast.db on the data PVC }
  - { name: RELAYCAST_ENV, chart: relaycast, why: reserved name in the extraEnv guard; the environment is passed as --env (server.environment) }
  - { name: RELAYCAST_INTERNAL_SECRET, chart: relaycast, why: reserved prefix in the extraEnv guard; the Secret is mounted as a file }
  - { name: RELAYCAST_WORKSPACE_BOOTSTRAP_SECRET, chart: relaycast, why: reserved prefix in the extraEnv guard; the Secret is mounted as a file }
  - { name: RELAYCAST_RELAYAUTH, chart: relaycast, why: reserved prefix in the extraEnv guard; the RelayAuth remote tagger is wired through credentials.relayauth.url and secretKeys.relayauthToken }
  - { name: RELAYCAST_CREDENTIAL, chart: relaycast, why: reserved prefix in the extraEnv guard; the credential format and local keyring are wired through credentials.* and secretKeys.credentialKeyring }
  - { name: BACKUP_KEEP, chart: relaycast, why: backup CronJob; from backup.keep }
  - { name: LOCK_STALE_MS, chart: relaycast, why: backup CronJob lock timeout (fixed) }
  - { name: RELAYAUTH_DB_PATH, chart: relayauth, why: fixed path on the data PVC }
  - { name: NPM_CONFIG_CACHE, chart: relayflows, why: runtime installer cache in an emptyDir }
  - { name: PATH, chart: relayflows, why: puts the installed runtime CLIs first }
  - { name: AGENT_RELAY_HOME, chart: relayflows, why: Cloud worker state on the PVC }

entries:
  # =========================================================================
  # sessions-pipeline: cluster capabilities
  # =========================================================================
  - id: req.k8s.cnpg-operator
    kind: requirement
    title: CloudNativePG operator installed
    description: |
      The in-cluster HoopDb is a CloudNativePG Cluster (cnpg/cluster 0.9.0), so the
      CNPG operator and its CRDs must be installed before the release. Pinned
      operator values are in deps/cnpg-operator-values.yaml.
    chart: sessions-pipeline
    values: [hoopdb.enabled]
    profiles: [selfhost-postgres, migration, aws-cnpg]
    status: shipped
    provided_by: { default: operator, aws-cnpg: stack }
    verify: kubectl get crd clusters.postgresql.cnpg.io && kubectl get deploy -A -l app.kubernetes.io/name=cloudnative-pg
    sources:
      - "charts/sessions-pipeline/Chart.yaml:12"
      - "charts/sessions-pipeline/values.yaml:85"
      - "deps/pins.txt:4"
      - "sessions-pipeline@7d7229b:stacks/aws/hardening.ts:375"

  - id: req.k8s.storage
    kind: requirement
    title: A default StorageClass for the in-cluster HoopDb and Locker volumes
    description: |
      The CNPG HoopDb claims hoopdb.cluster.storage.size (10Gi) and the MinIO Locker
      locker.persistence.size (20Gi) through the default StorageClass.
    chart: sessions-pipeline
    values: [hoopdb.cluster.storage.size, locker.persistence.size]
    profiles: [selfhost-postgres, migration, aws-cnpg]
    status: shipped
    provided_by: { default: operator, aws-cnpg: stack }
    verify: kubectl get storageclass (one marked default), then kubectl get pvc -n <ns> all Bound
    sources:
      - "charts/sessions-pipeline/values.yaml:102"
      - "charts/sessions-pipeline/values.yaml:155"

  - id: req.k8s.workload-identity
    kind: requirement
    title: Workload identity for the Locker bucket (EKS Pod Identity / GKE Workload Identity)
    description: |
      With locker.credentials.mode=podIdentity the charts omit LOCKER_ACCESS_KEY_ID and
      LOCKER_SECRET_ACCESS_KEY and the SDK uses the workload identity chain. Install
      the EKS Pod Identity Agent (unless EKS Auto Mode) and create the IAM
      associations for the rendered worker and alleyoop ServiceAccounts before the
      workloads start (GKE: Workload Identity bindings via serviceAccount.annotations).
      The role needs the bucket, and bucket creation plus versioning unless
      lockerInit is disabled.
    chart: sessions-pipeline
    values: [worker.locker.credentials.mode, alleyoop.locker.credentials.mode, worker.serviceAccount.annotations, alleyoop.serviceAccount.annotations]
    profiles: [aws-cnpg, aws-supabase, gcp-cloudsql]
    status: shipped
    provided_by: stack
    profile_values:
      aws-cnpg: { worker.locker.credentials.mode: podIdentity, alleyoop.locker.credentials.mode: podIdentity }
      aws-supabase: { worker.locker.credentials.mode: podIdentity, alleyoop.locker.credentials.mode: podIdentity }
      gcp-cloudsql: { worker.locker.credentials.mode: podIdentity, alleyoop.locker.credentials.mode: podIdentity }
    verify: aws eks list-pod-identity-associations --cluster-name <c> (one per worker/alleyoop ServiceAccount); then the locker-init Job (or a worker) reaches the bucket
    sources:
      - "README.md:152"
      - "charts/sessions-pipeline-worker/values.yaml:60"
      - "charts/sessions-pipeline-worker/templates/_env.tpl:77"

  - id: req.k8s.external-secrets-operator
    kind: requirement
    title: External Secrets Operator and a ClusterSecretStore (only with externalSecrets.enabled)
    description: |
      externalSecrets.enabled renders an ExternalSecret (external-secrets.io/v1) whose
      target is existingSecret. The ESO CRDs and the named secretStoreRef must exist,
      and every consumed key must be mapped in externalSecrets.data.
    chart: [sessions-pipeline-worker, alleyoop]
    values: ["sessions-pipeline-worker:externalSecrets.*", "alleyoop:externalSecrets.*"]
    profiles: [selfhost-postgres, migration, external-selfhosted, external-supabase, aws-cnpg, aws-supabase, gcp-cloudsql]
    status: shipped
    provided_by: operator
    verify: kubectl get crd externalsecrets.external-secrets.io && kubectl get clustersecretstore <name>; the ExternalSecret reports Ready
    sources:
      - "charts/sessions-pipeline-worker/values.yaml:248"
      - "charts/sessions-pipeline-worker/templates/externalsecret.yaml:20"
      - "charts/alleyoop/templates/externalsecret.yaml:11"

  # =========================================================================
  # sessions-pipeline: Secrets
  # =========================================================================
  - id: req.secret.image-pull
    kind: requirement
    title: Pull Secret for the private GHCR services image
    description: |
      ghcr.io/agentworkforce/96bulls-services is a private package. Create a
      docker-registry Secret and list it in the umbrella's shared imagePullSecrets
      (worker and alleyoop; the privileged SQL Jobs reuse worker.imagePullSecrets).
      The ECR path (EKS node role) needs none.
    chart: sessions-pipeline
    values: [worker.imagePullSecrets, alleyoop.imagePullSecrets]
    profiles: [selfhost-postgres, migration, external-selfhosted, external-supabase, aws-supabase, gcp-cloudsql]
    status: shipped
    provided_by: operator
    secrets:
      - name: "<pull secret>"
        note: type kubernetes.io/dockerconfigjson with read access to ghcr.io/agentworkforce/96bulls-services
    verify: kubectl get secret <pull secret> -o jsonpath='{.type}' is kubernetes.io/dockerconfigjson; pods are not ImagePullBackOff
    sources:
      - "README.md:128"
      - "charts/sessions-pipeline/values.yaml:24"
      - "charts/sessions-pipeline/templates/_privileged-sql-job.tpl:92"

  - id: req.secret.locker-credentials
    kind: requirement
    title: Locker credential Secret (MinIO root / S3 static keys)
    description: |
      In secret mode the workers and alleyoop read the Locker access key pair from
      existingSecret, and the bundled MinIO reads its root credential from the same
      Secret (locker.existingSecret). Not used with locker.credentials.mode=podIdentity.
    chart: sessions-pipeline
    values:
      - worker.existingSecret
      - alleyoop.existingSecret
      - locker.existingSecret
      - worker.secretKeys.lockerAccessKeyId
      - worker.secretKeys.lockerSecretAccessKey
      - alleyoop.secretKeys.lockerAccessKeyId
      - alleyoop.secretKeys.lockerSecretAccessKey
    env: [LOCKER_ACCESS_KEY_ID, LOCKER_SECRET_ACCESS_KEY]
    profiles: [selfhost-postgres, migration, external-selfhosted, external-supabase]
    status: shipped
    provided_by: operator
    secrets:
      - name: sessions-pipeline-locker
        name_paths: [worker.existingSecret]
        keys:
          - { key: rootUser, key_path: worker.secretKeys.lockerAccessKeyId }
          - { key: rootPassword, key_path: worker.secretKeys.lockerSecretAccessKey }
      - name: sessions-pipeline-locker
        name_paths: [alleyoop.existingSecret]
        keys:
          - { key: rootUser, key_path: alleyoop.secretKeys.lockerAccessKeyId }
          - { key: rootPassword, key_path: alleyoop.secretKeys.lockerSecretAccessKey }
      - name: sessions-pipeline-locker
        name_paths: [locker.existingSecret]
        note: the bundled MinIO's root credential
    verify: kubectl get secret sessions-pipeline-locker -o jsonpath='{.data}' has rootUser and rootPassword
    sources:
      - "charts/sessions-pipeline/values.yaml:3"
      - "charts/sessions-pipeline/values.yaml:28"
      - "charts/sessions-pipeline-worker/templates/_env.tpl:78"
      - "charts/alleyoop/templates/_env.tpl:66"

  - id: req.secret.summary-master-keys
    kind: requirement
    title: Summary encryption keyring (SUMMARY_MASTER_KEYS)
    description: |
      Bob Costas encrypts summary objects before they reach the Locker. The keyring
      ("<key-id>:<64 hex>[,<key-id>:<64 hex>...]", first is current) comes only from
      a Secret and is projected as a read-only file into Bob Costas only
      (SUMMARY_MASTER_KEYS_FILE). summaryEncryption.existingSecret empty follows
      worker.existingSecret; pod-identity installs with no shared Secret must set it.
    chart: sessions-pipeline
    values: [worker.summaryEncryption.existingSecret, worker.summaryEncryption.key, worker.summaryEncryption.mountPath, worker.summaryEncryption.fileName]
    env: [SUMMARY_MASTER_KEYS_FILE, SUMMARY_MASTER_KEYS]
    profiles: [selfhost-postgres, migration, external-selfhosted, external-supabase, aws-cnpg, aws-supabase, gcp-cloudsql]
    status: shipped
    provided_by: { default: operator, aws-cnpg: stack, aws-supabase: stack, gcp-cloudsql: stack }
    secrets:
      - name: { default: sessions-pipeline-locker, aws-cnpg: 96bulls-runtime, aws-supabase: sessions-pipeline-summary, gcp-cloudsql: 96bulls-gcp }
        name_paths: [worker.summaryEncryption.existingSecret, worker.existingSecret]
        keys:
          - { key: SUMMARY_MASTER_KEYS, key_path: worker.summaryEncryption.key }
    verify: kubectl exec deploy/<release>-worker-bob-costas -- test -r /var/run/secrets/sessions-pipeline/summary-master-keys; the Secret key parses as <id>:<64 hex>
    sources:
      - "README.md:143"
      - "charts/sessions-pipeline-worker/values.yaml:45"
      - "charts/sessions-pipeline-worker/templates/_env.tpl:102"
      - "charts/sessions-pipeline-worker/templates/_env.tpl:30"
      - "sessions-pipeline@7d7229b:src/shared/keyring.ts:17"

  - id: req.secret.hoopdb-url
    kind: requirement
    title: HoopDb connection Secret (HOOPDB_URL)
    description: |
      Every workload and migrate read HOOPDB_URL from hoopdb.existingSecret/key (else
      existingSecret / secretKeys.hoopdbUrl). With the in-cluster HoopDb it is the
      Secret CloudNativePG generates (hoopdb-app, key uri): nothing to create. With an
      external database the operator (or the stack) creates it; for supabase it is the
      migration role's connection string unless migrations.hoopdb separates them.
    chart: sessions-pipeline
    values: [worker.hoopdb.existingSecret, worker.hoopdb.key, worker.secretKeys.hoopdbUrl, alleyoop.hoopdb.existingSecret, alleyoop.hoopdb.key, alleyoop.secretKeys.hoopdbUrl]
    env: [HOOPDB_URL]
    profiles: [selfhost-postgres, migration, external-selfhosted, external-supabase, aws-cnpg, aws-supabase, gcp-cloudsql]
    status: shipped
    provided_by: { default: chart, external-selfhosted: operator, external-supabase: operator, aws-supabase: stack, gcp-cloudsql: stack }
    secrets:
      - name: { default: hoopdb-app, external-selfhosted: sessions-pipeline-hoopdb, external-supabase: sessions-pipeline-hoopdb, gcp-cloudsql: 96bulls-gcp }
        name_paths: [worker.hoopdb.existingSecret, worker.existingSecret]
        keys:
          - { key: { default: uri, external-selfhosted: HOOPDB_URL, external-supabase: HOOPDB_URL, gcp-cloudsql: HOOPDB_URL }, key_path: [worker.hoopdb.key, worker.secretKeys.hoopdbUrl] }
      - name: { default: hoopdb-app, external-selfhosted: sessions-pipeline-hoopdb, external-supabase: sessions-pipeline-hoopdb, gcp-cloudsql: 96bulls-gcp }
        name_paths: [alleyoop.hoopdb.existingSecret, alleyoop.existingSecret]
        keys:
          - { key: { default: uri, external-selfhosted: HOOPDB_URL, external-supabase: HOOPDB_URL, gcp-cloudsql: HOOPDB_URL }, key_path: [alleyoop.hoopdb.key, alleyoop.secretKeys.hoopdbUrl] }
    verify:
      default: kubectl get secret hoopdb-app -o jsonpath='{.data.uri}' is non-empty once the CNPG Cluster is ready
      external-selfhosted: kubectl get secret sessions-pipeline-hoopdb -o jsonpath='{.data.HOOPDB_URL}' | base64 -d | psql -X -c 'select 1'
      external-supabase: kubectl get secret sessions-pipeline-hoopdb -o jsonpath='{.data.HOOPDB_URL}' | base64 -d | psql -X -c 'select current_user'
    sources:
      - "charts/sessions-pipeline/values.yaml:39"
      - "charts/sessions-pipeline/profiles/external-selfhosted.yaml:11"
      - "charts/sessions-pipeline/profiles/external-supabase.yaml:24"
      - "charts/sessions-pipeline-worker/templates/_env.tpl:162"
      - "charts/alleyoop/templates/_env.tpl:54"

  - id: req.secret.hoopdb-migration-url
    kind: requirement
    title: Separate migration-owner connection Secret (HOOPDB_MIGRATION_URL)
    description: |
      On Cloud SQL the services connect as the least-privilege runtime role and only
      the migrate Job (and its wait-for-role) connects as the migration owner, from
      migrations.hoopdb.existingSecret/key.
    chart: sessions-pipeline
    values: [worker.migrations.hoopdb.existingSecret, worker.migrations.hoopdb.key]
    profiles: [gcp-cloudsql]
    status: shipped
    provided_by: stack
    secrets:
      - name: 96bulls-gcp
        name_paths: [worker.migrations.hoopdb.existingSecret]
        keys:
          - { key: HOOPDB_MIGRATION_URL, key_path: worker.migrations.hoopdb.key }
    verify: kubectl get secret 96bulls-gcp -o jsonpath='{.data.HOOPDB_MIGRATION_URL}' connects as the migration owner (select current_user)
    sources:
      - "charts/sessions-pipeline/ci/gcp-cloudsql-values.yaml:33"
      - "charts/sessions-pipeline-worker/values.yaml:93"
      - "sessions-pipeline@7d7229b:stacks/gcp/config.ts:1002"

  # =========================================================================
  # sessions-pipeline: tenant and auth
  # =========================================================================
  - id: req.sessions-pipeline.tenant-org-id
    kind: requirement
    title: Agent Relay org id (TENANT_ORG_ID)
    description: The org this install ingests for; every profile leaves it to the operator and the render fails without it.
    chart: sessions-pipeline
    values: [global.tenant.orgId, worker.tenant.orgId, alleyoop.tenant.orgId]
    env: [TENANT_ORG_ID]
    profiles: [selfhost-postgres, migration, external-selfhosted, external-supabase, aws-cnpg, aws-supabase, gcp-cloudsql]
    status: shipped
    provided_by: operator
    verify: helm template renders (it fails with "tenant.orgId (or global.tenant.orgId) is required" otherwise)
    sources:
      - "charts/sessions-pipeline/values.yaml:16"
