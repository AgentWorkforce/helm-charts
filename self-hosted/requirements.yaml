  - id: req.db.function-boundary
    kind: requirement
    title: The durable function boundary installed before the first migrate
    description: |
      The migrator's function-boundary gate refuses (function_boundary_unproven)
      without a catalog-proven control. global-default-revoke: on CNPG
      functionDefaultRevoke.bootstrapJob runs hoopdb_function_default_revoke.sql
      (-v migration_owner=hoop) and migrate waits for the exact default; external
      Postgres runs the same file as a superuser; Cloud SQL runs
      cloudsql_owner_function_default_revoke.sql as the migration owner.
      event-trigger (Supabase only): hoopdb_sessions_function_boundary_supabase.sql as
      postgres (-v runtime_role=bulls96_runtime), then migrate.ts --activation-check
      must report event_trigger.verified true. Never run the default-revoke file on
      Supabase.
    chart: 96bulls
    values: [functionDefaultRevoke.bootstrapJob.enabled, functionDefaultRevoke.bootstrapJob.sqlPath, worker.migrations.waitForRole.functionDefault]
    profiles: [selfhost-postgres, migration, aws-cnpg, external-selfhosted, external-supabase, aws-supabase, gcp-cloudsql]
    status: shipped
    provided_by: { default: chart, external-selfhosted: operator, external-supabase: operator, aws-supabase: operator, gcp-cloudsql: operator }
    profile_values:
      selfhost-postgres: { functionDefaultRevoke.bootstrapJob.enabled: true, worker.migrations.waitForRole.functionDefault: true }
      external-selfhosted: { functionDefaultRevoke.bootstrapJob.enabled: false }
      external-supabase: { functionDefaultRevoke.bootstrapJob.enabled: false }
    verify:
      default: 'the function-default Job completes and migrate''s wait-for-role logs "present: ... + owner function default"'
      external-supabase: migrate.ts --activation-check with HOOPDB_DB_MODE=supabase HOOPDB_FUNCTION_BOUNDARY_MODE=event-trigger reports event_trigger.verified true
      aws-supabase: no boundary is selected in this shape; migrate refuses with function_boundary_unproven until one is
    sources:
