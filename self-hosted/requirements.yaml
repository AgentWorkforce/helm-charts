# Env the charts render that is neither a requirement nor an option.
internal_env:
  - { name: SERVICE, chart: [96bulls-worker, alleyoop], why: selects the entry point of the one services image }
  - { name: OTEL_SERVICE_NAME, chart: [96bulls-worker, alleyoop], why: equals SERVICE }
  - { name: TMPDIR, chart: [96bulls-worker, alleyoop], why: the writable emptyDir under a read-only root filesystem }
  - { name: HOME, chart: [96bulls, 96bulls-worker, relayflows], why: a writable home under a read-only root filesystem }
  - { name: ROLES, chart: 96bulls-worker, why: wait-for-role init container; derived from waitForRole.role and migrations.runtimeRole }
  - { name: FUNCTION_DEFAULT, chart: 96bulls-worker, why: wait-for-role init container; derived from waitForRole.functionDefault }
  - { name: INTERVAL, chart: 96bulls-worker, why: wait-for-role poll interval (waitForRole.intervalSeconds) }
  - { name: CLUSTER, chart: 96bulls, why: privileged SQL Jobs; the CNPG cluster name (bootstrapJob.cluster) }
  - { name: DATABASE, chart: 96bulls, why: privileged SQL Jobs; the HoopDb database (bootstrapJob.database) }
  - { name: INGEST_PORT, chart: alleyoop, why: from ingest.port }
  - { name: PORT, chart: [relaycast, relayauth], why: from server.port }
  - { name: RELAYCAST_DB_PATH, chart: relaycast, why: fixed /data/relaycast.db on the data PVC }
  - { name: RELAYCAST_ENV, chart: relaycast, why: reserved name in the extraEnv guard; the environment is passed as --env (server.environment) }
  - { name: RELAYCAST_INTERNAL_SECRET, chart: relaycast, why: reserved prefix in the extraEnv guard; the Secret is mounted as a file }
  - { name: RELAYCAST_WORKSPACE_BOOTSTRAP_SECRET, chart: relaycast, why: reserved prefix in the extraEnv guard; the Secret is mounted as a file }
  - { name: BACKUP_KEEP, chart: relaycast, why: backup CronJob; from backup.keep }
  - { name: LOCK_STALE_MS, chart: relaycast, why: backup CronJob lock timeout (fixed) }
  - { name: RELAYAUTH_DB_PATH, chart: relayauth, why: fixed path on the data PVC }
  - { name: NPM_CONFIG_CACHE, chart: relayflows, why: runtime installer cache in an emptyDir }
  - { name: PATH, chart: relayflows, why: puts the installed runtime CLIs first }
  - { name: AGENT_RELAY_HOME, chart: relayflows, why: Cloud worker state on the PVC }

entries:
  # =========================================================================
  # 96bulls: cluster capabilities
  # =========================================================================
  - id: req.k8s.cnpg-operator
    kind: requirement
    title: CloudNativePG operator installed
    description: |
      The in-cluster HoopDb is a CloudNativePG Cluster (cnpg/cluster 0.9.0), so the
