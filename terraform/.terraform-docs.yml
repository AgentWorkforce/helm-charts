formatter: markdown table
output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->
sort:
  enabled: true
  by: required
settings:
  anchor: false
  default: true
  escape: true
  hide-empty: true
  html: false
  indent: 3
  lockfile: false
  required: true
  sensitive: true
  type: true
