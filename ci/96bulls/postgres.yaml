# kind-only HoopDb fixture: pgvector Postgres 17, ephemeral storage.
# Production uses CloudNativePG (cnpg 0.29.1 + cnpg/cluster 0.9.0).
apiVersion: v1
kind: Service
metadata: { name: hoopdb }
spec:
  selector: { app: hoopdb }
  ports: [{ name: pg, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: hoopdb }
spec:
  replicas: 1
  selector: { matchLabels: { app: hoopdb } }
  template:
    metadata: { labels: { app: hoopdb } }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          env:
            - { name: POSTGRES_USER, value: hoop }
            - { name: POSTGRES_PASSWORD, value: hoop-kind-only }
            - { name: POSTGRES_DB, value: hoopdb }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, hoop, -d, hoopdb] }
            periodSeconds: 2
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, emptyDir: {} }]
