# Shared kind values for sessions-pipeline-worker and alleyoop.
global:
  imageRegistry: ghcr.io
  otel:
    endpoint: http://otel-opentelemetry-collector:4318
image:
  repository: agentworkforce/96bulls-services
  tag: kind
  pullPolicy: Never
existingSecret: sessions-pipeline
locker:
  endpoint: http://locker:9000
  bucket: locker
tenant:
  orgId: org_kind
  workspaceId: ws_kind
deployment:
  name: selfhost
  id: kind
environment: local
auth:
  localJwks: true
migrations:
  databaseMode: selfhosted
  supabaseShim: true
  runtimeRole: sessions_pipeline_runtime
  runtimeRoleLogin: true
  functionBoundaryMode: global-default-revoke
