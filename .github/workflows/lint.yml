name: Lint Charts

on:
  pull_request:
  workflow_call:  # release.yml runs the same checks before publishing

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.1
  KUBECONFORM_VERSION: v0.8.0
  # ExternalSecret CRDs, so ci/*-values.yaml that enable ESO dry-run cleanly.
  ESO_VERSION: v2.14.0

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # version-bump check diffs against the base branch and reads release tags

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform

      # helm lint --strict, hook ban, render determinism, kubeconform; once per
      # charts/<chart>/ci/*-values.yaml.
      - name: Static chart checks
        run: scripts/ci/charts.sh static

      - name: Dependency pins are hook-free
        run: scripts/ci/deps.sh

      - name: 96bulls search Worker role render assertions
        run: |
          for repo in https://cloudnative-pg.github.io/charts https://charts.min.io/ https://open-telemetry.github.io/opentelemetry-helm-charts; do
            helm repo add "dep-$(echo "$repo" | md5sum | cut -c1-8)" "$repo" >/dev/null 2>&1 || true
          done
          helm dependency build charts/96bulls >/dev/null
          ci/96bulls-search-worker-role/render.sh

      - name: Chart version bumped
        if: github.event_name == 'pull_request'
        run: scripts/ci/version-bump.sh "origin/${{ github.base_ref }}"

  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: ci

      - name: Prepare cluster
        run: |
          kubectl apply --server-side -f "https://raw.githubusercontent.com/external-secrets/external-secrets/${ESO_VERSION}/deploy/crds/bundle.yaml"
          # CloudNativePG CRDs, so charts that render a postgresql.cnpg.io
          # Cluster (the 96bulls umbrella) dry-run cleanly.
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          read -r _ chart version values < <(grep '^cnpg-operator ' deps/pins.txt)
          helm template cnpg "$chart" --version "$version" -f "deps/$values" --include-crds --no-hooks \
            | yq 'select(.kind == "CustomResourceDefinition")' | kubectl apply --server-side -f -
          # A created CRD is not served until Established.
          kubectl wait --for=condition=Established crd --all --timeout=120s
          kubectl create namespace ci

      # Renders exactly the way Alchemy's Kubernetes.HelmChart installs
      # (helm template --no-hooks) and server-side dry-run applies the result,
      # so the API server validates every object.
      - name: Server-side dry-run apply
        run: scripts/ci/charts.sh dryrun

  # Live install of charts/relaycast on kind against the pinned image:
  # upgrade from the published 0.1.0, first-run bootstrap, register -> node
  # transport -> send -> receive, restart, backup + restore.
  relaycast-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed?
        id: changed
        run: |
          if [ "${{ github.event_name }}" != pull_request ] \
            || git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(charts|ci)/relaycast/'; then
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@v4
        if: steps.changed.outputs.run == 'true'
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22

      - uses: helm/kind-action@v1.15.1
        if: steps.changed.outputs.run == 'true'
        with:
          cluster_name: relaycast

      - name: Relaycast live smoke
        if: steps.changed.outputs.run == 'true'
        run: ci/relaycast/smoke.sh

  # Real CloudNativePG on kind: a fresh cluster (initdb SQL) and an existing one
  # (searchWorkerRole.bootstrapJob) converge to the same search Worker role.
  search-worker-role-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed?
        id: changed
        run: |
          if [ "${{ github.event_name }}" != pull_request ] \
            || git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(charts/96bulls/|deps/cnpg-|ci/96bulls-search-worker-role/)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@v4
        if: steps.changed.outputs.run == 'true'
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: helm/kind-action@v1.15.1
        if: steps.changed.outputs.run == 'true'
        with:
          cluster_name: 96bulls-role

      - name: Fresh and existing CNPG clusters converge
        if: steps.changed.outputs.run == 'true'
        run: ci/96bulls-search-worker-role/kind.sh
