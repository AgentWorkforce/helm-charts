name: Lint Charts

on:
  pull_request:
  workflow_call:  # release.yml and release-agent-relay.yml call this before publishing
    secrets:
      BULLS96_READ_TOKEN:
        required: false  # search-worker-role-kind fails closed without it

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.1
  KUBECONFORM_VERSION: v0.8.0
  # ExternalSecret CRDs, so ci/*-values.yaml that enable ESO dry-run cleanly.
  ESO_VERSION: v2.14.0

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # version-bump check diffs against the base branch and reads release tags

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform

      # helm lint --strict, hook ban, render determinism, kubeconform; once per
      # charts/<chart>/ci/*-values.yaml.
      - name: Static chart checks
        run: scripts/ci/charts.sh static

      - name: Agent Relay GCP proof render contract
        run: ci/agent-relay/render.sh

      - name: Dependency pins are hook-free
        run: scripts/ci/deps.sh

      - name: sessions-pipeline search Worker role render assertions
        run: |
          for repo in https://cloudnative-pg.github.io/charts https://charts.min.io/ https://open-telemetry.github.io/opentelemetry-helm-charts; do
            helm repo add "dep-$(echo "$repo" | md5sum | cut -c1-8)" "$repo" >/dev/null 2>&1 || true
          done
          helm dependency build charts/sessions-pipeline >/dev/null
          ci/sessions-pipeline-search-worker-role/render.sh

      # S3 artifact store of the relaycast and relayfile deploy Jobs and the
      # durable-actors control plane's S3 env (charts/*/ci/durable-actors-s3-values.yaml).
      - name: durable-actors S3 render assertions
        run: ci/actors-s3/render.sh

      # The development-preview customer handoff builds, verifies, extracts,
      # and its umbrella resolves every file:// dependency and renders.
      - name: Customer handoff package smoke
        run: ci/customer-handoff/smoke.sh

      # Every sessions-pipeline profile (charts/sessions-pipeline/profiles/*.yaml and ci/*-values.yaml)
      # renders with the manifests and role bootstrap path it must produce.
      - name: sessions-pipeline profile render matrix
        run: ci/sessions-pipeline-profiles/matrix.sh static

      # self-hosted/requirements.yaml against the charts: every template env var,
      # Secret key and Secret values path is registered; shipped entries exist in
      # the charts and planned ones are not referenced; the compatibility matrix
      # equals the pinned digests, services commit/generation and release tags.
      - name: Self-hosted requirements registry
        run: node ci/self-hosted-requirements/registry.mjs check

      # The checks themselves: deliberately broken copies must fail (and comment-only
      # mentions must not count as references).
      - name: Self-hosted requirements registry regression tests
        run: ci/self-hosted-requirements/test.sh

      # The gate validates evidence with a real JSON Schema 2020-12 validator.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install customer release gate dependencies
        run: python3 -m pip install -r ci/customer-release-gate/requirements.txt

      - name: Customer release gate regression tests
        run: python3 ci/customer-release-gate/test.py

      # The checked-in records stay consistent even while the release is
      # blocked: evidence is schema-valid, customer-images.yaml uses the gate's
      # vocabulary, and release.imageManifestSha256 is its current hash.
      - name: Customer release records are consistent
        run: python3 scripts/release/validate-customer-release.py --consistency

      - name: Self-hosted requirements doc is generated
        run: |
          node ci/self-hosted-requirements/registry.mjs render
          git diff --exit-code -- docs/self-hosted-requirements.md \
            || { echo "::error::docs/self-hosted-requirements.md is stale: run node ci/self-hosted-requirements/registry.mjs render and commit it"; exit 1; }

      - name: Chart version bumped
        if: github.event_name == 'pull_request'
        run: scripts/ci/version-bump.sh "origin/${{ github.base_ref }}"

  # Produces the `customer-release-gate` check name that branch protection and
  # self-hosted/customer-release-evidence.json's requiredStatusChecks refer to.
  customer-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The gate renders the fixture chart (helm), parses it (yq, preinstalled
      # on ubuntu-latest) and validates evidence with jsonschema.
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install customer release gate dependencies
        run: python3 -m pip install -r ci/customer-release-gate/requirements.txt
      - name: Customer release gate regression tests
        run: python3 ci/customer-release-gate/test.py

  # The setup skill follows the Agent Skills standard
  # (https://agentskills.io/specification). skills-ref is the reference
  # validator, pinned to an agentskills/agentskills commit (no tags yet).
  agent-skill:
    runs-on: ubuntu-latest
    env:
      SKILLS_REF_COMMIT: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install skills-ref
        run: python3 -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills@${SKILLS_REF_COMMIT}#subdirectory=skills-ref"
      - name: Validate the setup skill
        run: skills-ref validate ./.agents/skills/setting-up-self-hosted-agent-relay-gcp
      - name: No skill copy under .cursor
        run: test ! -e .cursor/skills/setting-up-self-hosted-agent-relay-gcp
      - name: Skill layout resolver tests
        run: bash .agents/skills/setting-up-self-hosted-agent-relay-gcp/scripts/test-layout.sh

  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: ci

      - name: Prepare cluster
        run: |
          kubectl apply --server-side -f "https://raw.githubusercontent.com/external-secrets/external-secrets/${ESO_VERSION}/deploy/crds/bundle.yaml"
          # CloudNativePG CRDs, so charts that render a postgresql.cnpg.io
          # Cluster (the sessions-pipeline umbrella) dry-run cleanly.
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          read -r _ chart version values < <(grep '^cnpg-operator ' deps/pins.txt)
          helm template cnpg "$chart" --version "$version" -f "deps/$values" --include-crds --no-hooks \
            | yq 'select(.kind == "CustomResourceDefinition")' | kubectl apply --server-side -f -
          # A created CRD is not served until Established.
          kubectl wait --for=condition=Established crd --all --timeout=120s
          kubectl create namespace ci

      # Renders exactly the way Alchemy's Kubernetes.HelmChart installs
      # (helm template --no-hooks) and server-side dry-run applies the result,
      # so the API server validates every object.
      - name: Server-side dry-run apply
        run: scripts/ci/charts.sh dryrun

      # The same sessions-pipeline profile matrix, applied server-side (dry run).
      - name: sessions-pipeline profile matrix (server-side dry run)
        run: ci/sessions-pipeline-profiles/matrix.sh dryrun

  # Live install of charts/relaycast on kind against the pinned image:
  # upgrade from the published 0.1.0, first-run bootstrap, register -> node
  # transport -> send -> receive, restart, backup + restore.
  relaycast-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed?
        id: changed
        run: |
          if [ "${{ github.event_name }}" != pull_request ] \
            || git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(charts|ci)/relaycast/'; then
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@v4
        if: steps.changed.outputs.run == 'true'
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22

      - uses: helm/kind-action@v1.15.1
        if: steps.changed.outputs.run == 'true'
        with:
          cluster_name: relaycast

      - name: Relaycast live smoke
        if: steps.changed.outputs.run == 'true'
        run: ci/relaycast/smoke.sh

  # Real CloudNativePG on kind, on a services image built here from the pinned
  # sessions-pipeline commit (ci/sessions-pipeline-search-worker-role/services-commit; the
  # published image is private). The role part (fresh and existing clusters
  # converge, idempotent, drift refused) and the full release (bootstrap ->
  # migrate -> phase 2 verify -> workloads, drift and phase-2-only failures)
  # both run. Required: no success on skip. The sessions-pipeline checkout uses
  # the BULLS96_READ_TOKEN Actions secret. It is kept for now: it is to be
  # replaced by a repository-scoped read-only credential when one is available.
  # Fork PRs and any run without the secret fail closed, as does a failed
  # checkout or image build.
  search-worker-role-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed?
        id: changed
        run: |
          if [ "${{ github.event_name }}" != pull_request ] \
            || git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(charts/sessions-pipeline/|charts/sessions-pipeline-worker/|deps/cnpg-|deps/pins\.txt$|ci/sessions-pipeline-search-worker-role/|ci/sessions-pipeline-profiles/|\.github/workflows/(lint|release|release-agent-relay)\.yml$)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      - name: Pinned sessions-pipeline commit
        if: steps.changed.outputs.run == 'true'
        id: pin
        run: |
          sha=$(tr -d '[:space:]' < ci/sessions-pipeline-search-worker-role/services-commit)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::services-commit must be a full 40-hex commit sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Fail closed: a fork PR (no secrets) or a missing secret is a failure,
      # never a skip. The value is only tested for emptiness, never printed.
      - name: Require the sessions-pipeline read token
        if: steps.changed.outputs.run == 'true'
        env:
          BULLS96_READ_TOKEN: ${{ secrets.BULLS96_READ_TOKEN }}
        run: |
          if [ -z "$BULLS96_READ_TOKEN" ]; then
            echo "::error::BULLS96_READ_TOKEN is not available to this run (fork pull request, or the Actions secret is missing). This job builds the private sessions-pipeline services image and is required: it fails rather than skips. A maintainer must run it from a branch in AgentWorkforce/helm-charts."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.changed.outputs.run == 'true'
        with:
          repository: AgentWorkforce/sessions-pipeline
          ref: ${{ steps.pin.outputs.sha }}
          token: ${{ secrets.BULLS96_READ_TOKEN }}
          path: .services-src
          persist-credentials: false

      - name: Build the services image (local only, never pushed)
        if: steps.changed.outputs.run == 'true'
        run: |
          [ "$(git -C .services-src rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}" ] || { echo "::error::checked out the wrong commit"; exit 1; }
          docker build -f .services-src/docker/services.Dockerfile -t "ghcr.io/agentworkforce/96bulls-services:kind-${{ steps.pin.outputs.sha }}" .services-src

      - uses: azure/setup-helm@v4
        if: steps.changed.outputs.run == 'true'
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: helm/kind-action@v1.15.1
        if: steps.changed.outputs.run == 'true'
        with:
          cluster_name: sessions-pipeline-role

      - name: Role converges; drift refused; full release incl. phase-2-only failure
        if: steps.changed.outputs.run == 'true'
        env:
          SERVICES_IMAGE: ghcr.io/agentworkforce/96bulls-services:kind-${{ steps.pin.outputs.sha }}
          SERVICES_SRC: .services-src
        run: ci/sessions-pipeline-search-worker-role/kind.sh
