apiVersion: v2
name: 96bulls
type: application
version: 0.2.0
# The 96Bulls services image version the app subcharts default to.
appVersion: "0.1.0"
description: >
  The 96Bulls sessions pipeline in one release: the 96bulls-worker and
  alleyoop app charts, plus optional HoopDb (CloudNativePG Cluster), Locker
  (MinIO) and an OpenTelemetry collector. Hook-free, so `helm install` and
  Alchemy's `helm template --no-hooks` + server-side apply behave the same.
  Requires the CloudNativePG operator when hoopdb.enabled (see deps/PINS.md).
home: https://github.com/AgentWorkforce/96BullSessions
keywords: [96bulls, sessions, pipeline, agentworkforce]
maintainers:
  - name: AgentWorkforce
    url: https://github.com/AgentWorkforce/helm-charts
sources:
  - https://github.com/AgentWorkforce/helm-charts/tree/main/charts/96bulls
# Third-party versions MUST match deps/pins.txt (scripts/ci/deps.sh checks).
dependencies:
  - name: 96bulls-worker
    version: 0.3.0
    repository: file://../96bulls-worker
    alias: worker
  - name: alleyoop
    version: 0.3.0
    repository: file://../alleyoop
  - name: cluster
    version: 0.9.0
    repository: https://cloudnative-pg.github.io/charts
    alias: hoopdb
    condition: hoopdb.enabled
  - name: minio
    version: 5.4.0
    repository: https://charts.min.io/
    alias: locker
    condition: locker.enabled
  - name: opentelemetry-collector
    version: 0.178.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    alias: otel
    condition: otel.enabled
