# Profile: a NEW self-host install with an in-cluster Postgres (CloudNativePG)
# HoopDb, selfhosted mode (96BullSessions migrate.ts, #99).
#   helm template 96bulls charts/96bulls -f charts/96bulls/profiles/selfhost-postgres.yaml \
#     --set global.tenant.orgId=<org> --set alleyoop.auth.jwksUrl=<jwks url>
# initdb creates session_directory_search_worker. Before migrate, two privileged
# Jobs run as the CNPG superuser on every deploy. hoopdb_runtime_role.sql
# creates the dedicated runtime role: it revokes TEMPORARY from PUBLIC on the
# database and grants the role CONNECT. hoopdb_function_default_revoke.sql
# installs the global-default-revoke function boundary.
# migrate's wait-for-role holds the migration until both roles exist and the
# owner's function default is exact. Needs the CloudNativePG operator
# (deps/cnpg-operator-values.yaml).
# Pinned services image (workloads and the privileged SQL Jobs): GHCR, built
# from 96BullSessions main fe5a2da06c11ea75544601cf90806c8bd2610ea7 (#124, #125 and
# #139), publish-image run 41371030320, migration
# generation eff8b3be46565b57ad8fa5e4a066dbb6d1fe608313d9c1680bfbcd484add259b.
hoopdb:
  enabled: true
locker:
  enabled: true
otel:
  enabled: false
worker:
  image:
    digest: "sha256:8efc653b89a1f133b3cd478f5aadd4de2393dbd89b5a82620af1859851e0c062"
  migrations:
    databaseMode: selfhosted
    supabaseShim: true
    runtimeRole: bulls96_runtime
    runtimeRoleLogin: true
    functionBoundaryMode: global-default-revoke
    waitForRole:
      enabled: true
      functionDefault: true
alleyoop:
  image:
    digest: "sha256:8efc653b89a1f133b3cd478f5aadd4de2393dbd89b5a82620af1859851e0c062"
privilegedSql:
  sqlImage:
    repository: ghcr.io/agentworkforce/96bulls-services
    digest: "sha256:8efc653b89a1f133b3cd478f5aadd4de2393dbd89b5a82620af1859851e0c062"
searchWorkerRole:
  bootstrapJob:
    enabled: false
runtimeRole:
  bootstrapJob:
    enabled: true
functionDefaultRevoke:
  bootstrapJob:
    enabled: true
