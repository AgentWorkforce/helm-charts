# Profile: an EXTERNAL Supabase project as HoopDb, supabase mode
# (96BullSessions migrate.ts, #99).
#   helm template 96bulls charts/96bulls -f charts/96bulls/profiles/external-supabase.yaml \
#     --set global.tenant.orgId=<org> --set alleyoop.auth.jwksUrl=<jwks url>
# FAIL-CLOSED, twice over. First, supabaseActivation.hold stops this profile
# from rendering. Second, functionBoundaryMode stays unset, so even a rendered
# migrate refuses with function_boundary_unproven before it writes anything.
# Both hold until the 96BullSessions PostgreSQL 16+ Supabase creator-edge
# compatibility change merges and its exact merge, image digest and generation
# are pinned here. The #99 image (3b60019) is NOT the production-Supabase pin:
# that change will produce a new generation and digest. No services image is
# pinned here yet.
# This profile turns off everything the self-host profiles carry: the in-cluster
# HoopDb, the plain-Postgres role shim, wait-for-role and every privileged SQL
# Job. The chart refuses each of those in supabase mode.
# Operator prerequisites, before the first migrate (see the 96BullSessions
# runbook session-directory-search-worker-bootstrap.md and the Supabase G6
# activation dossier):
#   1. A Secret named 96bulls-hoopdb, key HOOPDB_URL, holding the Supabase
#      connection string for the migration role.
#   2. session_directory_search_worker, created and verified as the runbook
#      says. The migrator only verifies it.
#   3. The dedicated runtime role bulls96_runtime, LOGIN, with no workload role.
#      It must not be the migration owner, and it needs least-privilege
#      attributes, CONNECT, no TEMPORARY (none from PUBLIC either) and no role
#      membership. The migrator only verifies it. Do not use the legacy
#      relayhistory_runtime: the production preflight found it drifted
#      (BYPASSRLS, TEMPORARY, a creator edge).
#   4. The function boundary. hoopdb_function_default_revoke.sql is CNPG/selfhost
#      only: never run it on Supabase, where the owner is postgres. The control
#      on Supabase is an operator decision (96BullSessions #98). Until it exists,
#      leave functionBoundaryMode unset; the migrator then refuses with
#      function_boundary_unproven, and nothing is written. In supabase mode the
#      migrator leaves the platform superuser (supabase_admin) out of creator
#      coverage; every other role stays covered.
supabaseActivation:
  hold: true
hoopdb:
  enabled: false
worker:
  hoopdb:
    existingSecret: 96bulls-hoopdb
    key: HOOPDB_URL
  migrations:
    databaseMode: supabase
    supabaseShim: false
    runtimeRole: bulls96_runtime
    runtimeRoleLogin: true
    runtimeWorkloadRole: ""
    # Fail-closed until the Supabase creator-edge change lands (see above).
    functionBoundaryMode: ""
    waitForRole:
      enabled: false
      role: session_directory_search_worker
      functionDefault: false
alleyoop:
  hoopdb:
    existingSecret: 96bulls-hoopdb
    key: HOOPDB_URL
searchWorkerRole:
  bootstrapJob:
    enabled: false
runtimeRole:
  bootstrapJob:
    enabled: false
functionDefaultRevoke:
  bootstrapJob:
    enabled: false
