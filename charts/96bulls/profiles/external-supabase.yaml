# Profile: an EXTERNAL Supabase project as HoopDb, supabase mode
# (96BullSessions migrate.ts, #99).
#   helm template 96bulls charts/96bulls -f charts/96bulls/profiles/external-supabase.yaml \
#     --set global.tenant.orgId=<org> --set alleyoop.auth.jwksUrl=<jwks url>
# Services image: GHCR, built from 96BullSessions main
# 7d7229bb31c121ecb98cd4e35c248fc2cf5669ad (#124 session list RPC, #125 the
# Supabase event-trigger function boundary, #139 its manifest sync, #137 the exact sessions
# function ACL check in every non-local boundary mode), publish-image run 41375745173, generation
# eff8b3be46565b57ad8fa5e4a066dbb6d1fe608313d9c1680bfbcd484add259b.
# Function boundary: event-trigger (HOOPDB_FUNCTION_BOUNDARY_MODE), the path
# chosen for Supabase over the project-wide default revoke (96BullSessions
# #125). migrationProfile() at 7d7229b accepts it only in supabase mode.
# FAIL-CLOSED: supabaseActivation.hold stops this profile from rendering. Even
# rendered, migrate refuses with function_boundary_unproven before any write
# until the operator has installed the reviewed event trigger (prerequisite 4)
# and the catalog proves it. Lift the hold only when this image is confirmed as
# the production-Supabase pin and the live Supabase steps are approved.
# This profile turns off everything the self-host profiles carry: the in-cluster
# HoopDb, the plain-Postgres role shim, wait-for-role and every privileged SQL
# Job. The chart refuses each of those in supabase mode.
# Operator prerequisites, before the first migrate (see the 96BullSessions
# runbook session-directory-search-worker-bootstrap.md and the Supabase G6
# activation dossier):
#   1. A Secret named 96bulls-hoopdb, key HOOPDB_URL, holding the Supabase
#      connection string for the migration role.
#   2. session_directory_search_worker, created as postgres with
#      supabase/bootstrap/session_directory_search_worker_supabase.sql (the
#      Supabase-only, transactional wrapper). The migrator only verifies it.
#   3. The dedicated runtime role bulls96_runtime, LOGIN, with no workload role,
#      created as postgres with supabase/bootstrap/hoopdb_runtime_role_supabase.sql
#      -v runtime_role=bulls96_runtime -v runtime_login=true. That wrapper accepts
#      only the exact PG16+ creator edge from supabase_admin, and it keeps
#      Supabase's PUBLIC TEMPORARY baseline, which the migrator validates. The
#      role must not be the migration owner and needs least-privilege attributes
#      and CONNECT. The migrator only verifies it. Do not use the legacy
#      relayhistory_runtime: the production preflight found it drifted
#      (BYPASSRLS, TEMPORARY, a creator edge).
#   4. The function boundary, after 2 and 3 and before the first migrate: run
#      supabase/bootstrap/hoopdb_sessions_function_boundary_supabase.sql as
#      postgres with -v runtime_role=bulls96_runtime. It installs the
#      ddl_command_end trigger hoopdb_sessions_function_boundary (ENABLE ALWAYS)
#      scoped to sessions, with no ALTER DEFAULT PRIVILEGES. If supautils refuses
#      CREATE EVENT TRIGGER it fails closed (55000) and creates nothing. Then
#      `migrate.ts --activation-check` with HOOPDB_DB_MODE=supabase and
#      HOOPDB_FUNCTION_BOUNDARY_MODE=event-trigger must report
#      event_trigger.verified: true. hoopdb_function_default_revoke.sql is
#      CNPG/selfhost only: never run it on Supabase, where the owner is postgres.
#      In supabase mode the migrator leaves the platform superuser
#      (supabase_admin) out of creator coverage; every other role stays covered.
supabaseActivation:
  hold: true
hoopdb:
  enabled: false
worker:
  image:
    digest: "sha256:6f22ea17dff336e1431664542759fd27958649388b90a0b2f0881883caa7c6b2"
  hoopdb:
    existingSecret: 96bulls-hoopdb
    key: HOOPDB_URL
  migrations:
    databaseMode: supabase
    supabaseShim: false
    runtimeRole: bulls96_runtime
    runtimeRoleLogin: true
    runtimeWorkloadRole: ""
    # supabase only; the migrator refuses it elsewhere (see prerequisite 4).
    functionBoundaryMode: event-trigger
    waitForRole:
      enabled: false
      role: session_directory_search_worker
      functionDefault: false
alleyoop:
  image:
    digest: "sha256:6f22ea17dff336e1431664542759fd27958649388b90a0b2f0881883caa7c6b2"
  hoopdb:
    existingSecret: 96bulls-hoopdb
    key: HOOPDB_URL
searchWorkerRole:
  bootstrapJob:
    enabled: false
runtimeRole:
  bootstrapJob:
    enabled: false
functionDefaultRevoke:
  bootstrapJob:
    enabled: false
