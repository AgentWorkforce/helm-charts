## 96bulls: the sessions pipeline in one release.
##
## Before installing, create one Secret (name: existingSecret below) with keys
## rootUser, rootPassword and SUMMARY_MASTER_KEYS. It supplies MinIO's root
## credential, the workers' Locker credential, and Bob Costas's summary object
## encryption key. Only Bob Costas receives SUMMARY_MASTER_KEYS. With
## hoopdb.enabled, HOOPDB_URL comes from the Secret CloudNativePG generates
## ("hoopdb-app", key "uri"); nothing else to create.
##
## One release per namespace: dependency objects use fixed names (hoopdb,
## locker, otel-collector) so the app charts can address them.

global:
  imageRegistry: ghcr.io
  tenant:
    orgId: ""          # REQUIRED: your Agent Relay org id
  otel:
    # OTLP/HTTP endpoint of YOUR observability backend or collector. Empty =
    # no export. With otel.enabled below: http://otel-collector:4318
    endpoint: ""

# Shared by both app charts (YAML anchors keep one copy).
shared: &shared
  existingSecret: 96bulls-locker
  secretKeys:
    hoopdbUrl: HOOPDB_URL
    lockerAccessKeyId: rootUser
    lockerSecretAccessKey: rootPassword
  summaryEncryption:
    # Empty follows worker.existingSecret, including user overrides. Set a
    # name only when summary custody belongs in a separate Secret.
    existingSecret: ""
    key: SUMMARY_MASTER_KEYS
  hoopdb:
    existingSecret: hoopdb-app
    key: uri
  locker:
    endpoint: http://locker:9000
    bucket: locker
    region: us-east-1
    credentials:
      mode: secret
  tenant:
    orgId: ""          # empty = global.tenant.orgId
    workspaceId: default
  deployment:
    name: selfhost
    id: ""

worker:
  <<: *shared

alleyoop:
  <<: *shared
  auth:
    # REQUIRED: RelayAuth JWKS URL (or auth.localJwks=true for kind/local).
    jwksUrl: ""

# ---------------------------------------------------------------------------
# HoopDb: a CloudNativePG Cluster (cnpg/cluster). Needs the CloudNativePG
# operator installed first (deps/cnpg-operator-values.yaml). Disable to use
# your own Postgres 17 with vector + pg_trgm: then set worker.hoopdb and
# alleyoop.hoopdb to your Secret.
# ---------------------------------------------------------------------------
hoopdb:
  enabled: true
  fullnameOverride: hoopdb
  type: postgresql
  mode: standalone
  version:
    postgresql: "17"
  cluster:
    instances: 1
    # CNPG standard Postgres 17.11; ships vector and pg_trgm (deps/PINS.md).
    imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie@sha256:ed6923f9ba2399cf9070379a353c710c29ced8a294be73986a2c3dae7e599ce3
    storage:
      size: 10Gi
    walStorage:
      enabled: false
    enableSuperuserAccess: false
    # Non-empty on purpose: with no parameters the chart renders
    # `postgresql:` as null, which the CRD rejects without the operator's
    # defaulting webhook (CI dry-run, or the operator not yet running).
    postgresql:
      parameters:
        max_connections: "200"
    monitoring:
      enabled: false
    initdb:
      database: hoopdb
      owner: hoop
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS pg_trgm
        # Supabase roles the migrations GRANT to; created as superuser so the
        # app role keeps least privilege. Runs once (CNPG mangles $$ quoting).
        - CREATE ROLE anon NOLOGIN NOINHERIT
        - CREATE ROLE authenticated NOLOGIN NOINHERIT
        - CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS
        # The session directory search Worker role (96BullSessions
        # runbooks/session-directory-search-worker-bootstrap.md). The HoopDb
        # migration only verifies it; creating it and setting a role parameter
        # need a superuser on PostgreSQL 16+, which postInit SQL runs as. New
        # clusters only: existing clusters use searchWorkerRole.bootstrapJob.
        # Remove these two lines to opt out (the role is then never created).
        - CREATE ROLE session_directory_search_worker NOLOGIN NOINHERIT NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION
        - ALTER ROLE session_directory_search_worker SET statement_timeout = '2s'
  backups:
    enabled: false

# ---------------------------------------------------------------------------
# Locker: MinIO (standalone). Disable to use your own S3: then set
# worker.locker / alleyoop.locker and the credential Secret.
# The bucket is created by 96bulls-worker's locker-init Job, not MinIO's
# post-install hook (hooks never run under --no-hooks).
# ---------------------------------------------------------------------------
locker:
  enabled: true
  fullnameOverride: locker
  mode: standalone
  replicas: 1
  existingSecret: 96bulls-locker
  # MinIO no longer publishes public images; Chainguard's is public, signed
  # and digest-pinned (free tier is :latest only, so bump the digest by hand).
  image:
    repository: cgr.dev/chainguard/minio
    tag: latest@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests: { memory: 512Mi }
  buckets: []
  users: []
  policies: []
  svcaccts: []
  consoleService: { type: ClusterIP }

# ---------------------------------------------------------------------------
# OpenTelemetry collector. OFF by default: customers bring their own
# observability stack (set global.otel.endpoint). Enable it to run a collector
# in the release. Its safe default drops telemetry; replace the exporter and
# pipeline configuration with your backend outside local testing.
# ---------------------------------------------------------------------------
otel:
  enabled: false
  fullnameOverride: otel-collector
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
    # Must track the chart's appVersion (0.137.0 rejects this chart's config).
    tag: "0.163.2"
  config:
    exporters:
      nop: {}
    service:
      pipelines:
        traces: { receivers: [otlp], exporters: [nop] }
        metrics: { receivers: [otlp], exporters: [nop] }
        logs: { receivers: [otlp], exporters: [nop] }

# ---------------------------------------------------------------------------
# session_directory_search_worker on an EXISTING HoopDb cluster.
# postInitApplicationSQL above only runs at initdb. This Job runs the HoopDb
# bootstrap file (supabase/bootstrap/session_directory_search_worker.sql,
# taken from the pinned services image) as the CNPG superuser `postgres`, by
# `kubectl exec` into the primary: no superuser Secret, enableSuperuserAccess
# stays false. Idempotent and atomic (it never alters an existing role; a
# role that differs from the spec fails it with 55000). Separate from the
# hoopdb-migrate Job, with its own ServiceAccount and a namespace Role that
# can only list/get pods and exec. Off by default: running it is an operator
# step under the deploy approval. Disabling it (or deleting the release)
# removes the Job and its RBAC; the role itself is never dropped (see the
# runbook's "Rollback and removal").
# The migrate Job fails closed (42704) until the role exists and retries
# (worker.migrations.backoffLimit), so the two may be applied together.
# ---------------------------------------------------------------------------
searchWorkerRole:
  bootstrapJob:
    enabled: false
    # REQUIRED when enabled: the services image that carries the file, by digest.
    sqlImage:
      repository: ""
      digest: ""
    sqlPath: /app/supabase/bootstrap/session_directory_search_worker.sql
    # kubectl (with a shell) to exec into the CNPG primary. alpine/k8s 1.34.1.
    kubectlImage:
      repository: docker.io/alpine/k8s
      tag: "1.34.1"
      digest: "sha256:ec714df3813b5405292860f8a1c55c5727bf8c33c88992f1e981efad8065547f"
    # The CNPG Cluster (hoopdb.fullnameOverride) and its application database.
    cluster: hoopdb
    database: hoopdb
    backoffLimit: 3
    activeDeadlineSeconds: 600
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }

