# kind: small volumes, local JWKS, images loaded into kind (pullPolicy Never).
# In-cluster CNPG HoopDb, selfhosted mode. kind.sh points the bootstrap Jobs'
# sql image at the services image it builds.
global:
  otel:
    endpoint: http://otel-collector:4318
  tenant:
    orgId: org_kind
worker:
  image: { pullPolicy: Never }
  environment: local
  migrations:
    databaseMode: selfhosted
    supabaseShim: true
    runtimeRole: bulls96_runtime
    runtimeRoleLogin: true
    functionBoundaryMode: global-default-revoke
    waitForRole:
      enabled: true
      functionDefault: true
alleyoop:
  image: { pullPolicy: Never }
  environment: local
  auth:
    localJwks: true
  secretKeys:
    jwksJson: JWKS_JSON
hoopdb:
  cluster:
    storage: { size: 2Gi }
locker:
  persistence: { enabled: false }
  resources:
    requests: { memory: 256Mi }
otel:
  enabled: true
runtimeRole:
  bootstrapJob:
    enabled: true
functionDefaultRevoke:
  bootstrapJob:
    enabled: true
privilegedSql:
  sqlImage:
    digest: "sha256:8efc653b89a1f133b3cd478f5aadd4de2393dbd89b5a82620af1859851e0c062"
