# Existing CNPG HoopDb cluster: the search Worker role bootstrap Job as well.
global:
  tenant:
    orgId: org_ci
alleyoop:
  auth:
    jwksUrl: https://relayauth.example.com/.well-known/jwks.json
searchWorkerRole:
  bootstrapJob:
    enabled: true
worker:
  migrations:
    databaseMode: selfhosted
    supabaseShim: true
    runtimeRole: bulls96_runtime
    runtimeRoleLogin: true
    functionBoundaryMode: global-default-revoke
    waitForRole:
      enabled: true
      functionDefault: true
runtimeRole:
  bootstrapJob:
    enabled: true
functionDefaultRevoke:
  bootstrapJob:
    enabled: true
# The final 7d7229b services image (GHCR publish-image run 41375745173).
privilegedSql:
  sqlImage:
    digest: "sha256:6f22ea17dff336e1431664542759fd27958649388b90a0b2f0881883caa7c6b2"
