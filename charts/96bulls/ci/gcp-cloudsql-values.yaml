# GKE + Cloud SQL (stacks/gcp/config.ts): an external plain-Postgres HoopDb in
# selfhosted mode, the shim on, global-default-revoke, the dedicated runtime
# role. The roles and the function default are operator steps on Cloud SQL, so
# there are no in-cluster SQL Jobs; migrate still waits for the roles. Managed
# bucket through Workload Identity (podIdentity mode).
global:
  tenant:
    orgId: org_ci
worker:
  existingSecret: 96bulls-gcp
  summaryEncryption:
    existingSecret: 96bulls-gcp
    key: SUMMARY_MASTER_KEYS
  hoopdb:
    existingSecret: 96bulls-gcp
    key: HOOPDB_URL
  locker:
    endpoint: ""
    bucket: 96bulls-ci
    region: us-central1
    credentials:
      mode: podIdentity
  lockerInit:
    enabled: false
  migrations:
    databaseMode: selfhosted
    supabaseShim: true
    runtimeRole: bulls96_runtime
    runtimeRoleLogin: true
    functionBoundaryMode: global-default-revoke
alleyoop:
  existingSecret: 96bulls-gcp
  hoopdb:
    existingSecret: 96bulls-gcp
    key: HOOPDB_URL
  locker:
    endpoint: ""
    bucket: 96bulls-ci
    region: us-central1
    credentials:
      mode: podIdentity
  auth:
    jwksUrl: https://relayauth.example.com/.well-known/jwks.json
hoopdb:
  enabled: false
locker:
  enabled: false
