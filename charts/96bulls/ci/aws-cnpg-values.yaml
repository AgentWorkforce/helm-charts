# AWS EKS CNPG proof stage (stacks/aws/eks.ts, hoopdb backend "cnpg"): the
# in-cluster HoopDb in selfhosted mode with the privileged runtime-role and
# function-default Jobs, S3 Locker through Pod Identity, otel collector on.
# Pinned services image: the immutable ECR digest built from 96BullSessions
# 3b6001925ef2d8caf5190063e101e2ebf258e902 (tag sha-3b60019..., amd64+arm64,
# publish-image-ecr run 41275714965). It predates the Supabase compatibility
# fix: production activation needs a republish.
global:
  imageRegistry: ""
  tenant:
    orgId: org_ci
  otel:
    endpoint: http://otel-collector:4318
worker:
  image:
    repository: 500268966557.dkr.ecr.us-west-2.amazonaws.com/96bulls-services
    digest: "sha256:b77847dbd418e5eae32c2d75226e5eb6677f77b05921d665c52aebca87df513b"
  existingSecret: ""
  summaryEncryption:
    existingSecret: 96bulls-runtime
    key: SUMMARY_MASTER_KEYS
  locker:
    endpoint: ""
    bucket: 96bulls-ci
    region: us-west-2
    credentials:
      mode: podIdentity
  lockerInit:
    enabled: false
  deployment:
    name: hosted
    id: ci
  migrations:
    databaseMode: selfhosted
    supabaseShim: true
    runtimeRole: bulls96_runtime
    runtimeRoleLogin: true
    functionBoundaryMode: global-default-revoke
    waitForRole:
      enabled: true
      functionDefault: true
alleyoop:
  image:
    repository: 500268966557.dkr.ecr.us-west-2.amazonaws.com/96bulls-services
    digest: "sha256:b77847dbd418e5eae32c2d75226e5eb6677f77b05921d665c52aebca87df513b"
  existingSecret: ""
  locker:
    endpoint: ""
    bucket: 96bulls-ci
    region: us-west-2
    credentials:
      mode: podIdentity
  auth:
    jwksUrl: https://relayauth.example.com/.well-known/jwks.json
  deployment:
    name: hosted
    id: ci
locker:
  enabled: false
otel:
  enabled: true
runtimeRole:
  bootstrapJob:
    enabled: true
functionDefaultRevoke:
  bootstrapJob:
    enabled: true
privilegedSql:
  sqlImage:
    repository: 500268966557.dkr.ecr.us-west-2.amazonaws.com/96bulls-services
    digest: "sha256:b77847dbd418e5eae32c2d75226e5eb6677f77b05921d665c52aebca87df513b"
