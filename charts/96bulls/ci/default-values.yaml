# New self-host install, in-cluster CNPG HoopDb (selfhosted mode).
global:
  tenant:
    orgId: org_ci
alleyoop:
  auth:
    jwksUrl: https://relayauth.example.com/.well-known/jwks.json
worker:
  migrations:
    databaseMode: selfhosted
    supabaseShim: true
    runtimeRole: bulls96_runtime
    runtimeRoleLogin: true
    functionBoundaryMode: global-default-revoke
    waitForRole:
      enabled: true
      functionDefault: true
runtimeRole:
  bootstrapJob:
    enabled: true
functionDefaultRevoke:
  bootstrapJob:
    enabled: true
# The final b47c1e6 services image (GHCR publish-image run 41333160108).
privilegedSql:
  sqlImage:
    digest: "sha256:e48d62dacc6dd6c0d0f912656693bb4a937c1f0d14562afa273601ea1ba0463a"
