# New self-host install, in-cluster CNPG HoopDb (selfhosted mode).
global:
  tenant:
    orgId: org_ci
alleyoop:
  auth:
    jwksUrl: https://relayauth.example.com/.well-known/jwks.json
worker:
  migrations:
    databaseMode: selfhosted
    supabaseShim: true
    runtimeRole: bulls96_runtime
    runtimeRoleLogin: true
    functionBoundaryMode: global-default-revoke
    waitForRole:
      enabled: true
      functionDefault: true
runtimeRole:
  bootstrapJob:
    enabled: true
functionDefaultRevoke:
  bootstrapJob:
    enabled: true
# The final fe5a2da services image (GHCR publish-image run 41371030320).
privilegedSql:
  sqlImage:
    digest: "sha256:8efc653b89a1f133b3cd478f5aadd4de2393dbd89b5a82620af1859851e0c062"
