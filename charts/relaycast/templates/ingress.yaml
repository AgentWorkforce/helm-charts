{{- include "relaycast.validate" . }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "relaycast.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relaycast.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          # Relaycast 8.0.0 cannot authenticate anonymous workspace creation.
          # Exact matches take precedence over the catch-all Prefix, so public
          # POST /v1/workspaces never reaches the runtime through this Ingress.
          - path: /v1/workspaces
            pathType: Exact
            backend:
              service:
                name: {{ include "relaycast.fullname" $ }}-workspace-bootstrap-deny
                port:
                  name: deny
          - path: /v1/workspaces/
            pathType: Exact
            backend:
              service:
                name: {{ include "relaycast.fullname" $ }}-workspace-bootstrap-deny
                port:
                  name: deny
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "relaycast.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
