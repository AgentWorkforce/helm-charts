{{- include "relaycast.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relaycast.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relaycast.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "relaycast.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "relaycast.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "relaycast.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: relaycast
          image: {{ include "relaycast.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --base-url
            - {{ .Values.baseUrl | quote }}
            - --db
            - /data/relaycast.db
            - --port
            - {{ .Values.server.port | quote }}
            - --env
            - {{ .Values.server.environment | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.server.port | quote }}
            - name: RELAYCAST_DB_PATH
              value: /data/relaycast.db
            - name: RELAYCAST_INTERNAL_SECRET_FILE
              value: {{ include "relaycast.secretMountPath" . }}/internal-secret
            - name: RELAYCAST_WORKSPACE_BOOTSTRAP_SECRET_FILE
              value: {{ include "relaycast.secretMountPath" . }}/workspace-bootstrap-secret
            - name: RELAYCAST_PUBLIC_WORKSPACE_CREATE
              value: {{ ternary "true" "false" .Values.publicWorkspaceCreate | quote }}
            {{- if .Values.bootstrapProofRequired }}
            - name: RELAYCAST_WORKSPACE_BOOTSTRAP_PROOF_REQUIRED
              value: "true"
            {{- end }}
            {{- if .Values.allowInsecureBaseUrl }}
            - name: RELAYCAST_ALLOW_INSECURE_BASE_URL
              value: "true"
            {{- with .Values.privateDnsSuffixes }}
            - name: RELAYCAST_PRIVATE_DNS_SUFFIXES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.insecureBaseUrlHosts }}
            - name: RELAYCAST_INSECURE_BASE_URL_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.retention.messageTtlDays }}
            - name: RELAYCAST_MESSAGE_TTL_DAYS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mailbox.ttlMs }}
            - name: RELAYCAST_MAILBOX_TTL_MS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mailbox.depthCap }}
            - name: RELAYCAST_MAILBOX_DEPTH_CAP
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: {{ include "relaycast.secretMountPath" . }}
              readOnly: true
            {{- if .Values.backup.enabled }}
            # Mounted (read-only) so the backup claim is provisioned and bound
            # with the release, on this pod's node, rather than at the first
            # scheduled backup.
            - name: backup
              mountPath: /backup
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "relaycast.claimName" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: secrets
          secret:
            secretName: {{ .Values.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.secretKeys.internalSecret | quote }}
                path: internal-secret
              - key: {{ .Values.secretKeys.bootstrapSecret | quote }}
                path: workspace-bootstrap-secret
        {{- if .Values.backup.enabled }}
        - name: backup
          persistentVolumeClaim:
            claimName: {{ include "relaycast.backupClaimName" . }}
            readOnly: true
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
