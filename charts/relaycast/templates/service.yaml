{{- include "relaycast.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "relaycast.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relaycast.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.service.annotations | default dict) }}
  {{- $backendConfig := .Values.service.backendConfig }}
  {{- if not (or (kindIs "invalid" $backendConfig) (and (kindIs "string" $backendConfig) (eq $backendConfig ""))) }}
  {{- if not (and (kindIs "string" $backendConfig) (regexMatch "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" $backendConfig)) }}{{ fail "service.backendConfig must be a BackendConfig name (DNS-1123 label, at most 63 characters)" }}{{ end }}
  {{- if hasKey $annotations "cloud.google.com/backend-config" }}{{ fail "set service.backendConfig or service.annotations.cloud.google.com/backend-config, not both" }}{{ end }}
  {{- $_ := set $annotations "cloud.google.com/backend-config" (dict "default" $backendConfig | toJson) }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "relaycast.selectorLabels" . | nindent 4 }}
