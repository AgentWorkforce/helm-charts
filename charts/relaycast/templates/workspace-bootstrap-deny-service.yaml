{{- include "relaycast.validate" . }}
{{- if .Values.ingress.enabled }}
# Intentionally selectorless: the Ingress routes the unauthenticated workspace
# bootstrap endpoint here, where it has no backing endpoints and fails closed.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "relaycast.fullname" . }}-workspace-bootstrap-deny
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relaycast.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: deny
      port: 80
      targetPort: 80
      protocol: TCP
{{- end }}
