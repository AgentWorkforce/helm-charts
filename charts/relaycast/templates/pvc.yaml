{{- include "relaycast.validate" . }}
{{- if and (not .Values.persistence.existingClaim) (include "relaycast.needsDataClaim" .) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "relaycast.claimName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relaycast.labels" . | nindent 4 }}
  {{- with .Values.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
