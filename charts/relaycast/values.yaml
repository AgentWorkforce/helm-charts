# Relaycast self-host currently uses one SQLite database and local file store.
# The chart therefore permits exactly one replica and uses Recreate upgrades.
replicaCount: 1

image:
  repository: ghcr.io/agentworkforce/relaycast-self-host
  # relaycast-self-host:12.7.0, built from relaycast main bf713d86 by the
  # reviewed publish-container workflow (engine 12.7.0). Immutable
  # multi-platform manifest (linux/amd64 and linux/arm64) with an SPDX SBOM,
  # max-mode provenance and a GitHub build-provenance attestation.
  digest: sha256:81274dca7ab58673383dc7a9c777f422f29606c7422e81b5ea15724770f1455e
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

server:
  port: 8787
  environment: production

runtime:
  # sqlite: the released portable single-node image (one replica, SQLite and
  #   files on one PVC).
  # durable-actors: the Relaycast engine in one TerseAI durable-actors
  #   `Workspace` actor per workspace, behind a stateless gateway Deployment
  #   with the same name, Service and selector. Env contract v1:
  #   docs/self-hosted-durable-actors.md. Requires a durable-actors control
  #   plane (agent-relay components.durableActors) and ar_ credentials.
  backend: sqlite
  durableActors:
    projectId: relaycast
    # durable-actors organization the deployer registers under.
    organizationId: relaycast
    # Control-plane origin. Empty: the umbrella's durable-actors release,
    # http://<release>-durable-actors.<namespace>.svc.cluster.local:7100.
    controlPlaneUrl: ""
    # Optional DURABLE_ACTORS_HOME_REGION for the gateway's invocations.
    homeRegion: ""
    gateway:
      image:
        repository: ghcr.io/agentworkforce/relaycast-actors-gateway
        # Pin a digest; a tag is accepted for local proofs only.
        digest: ""
        tag: ""
        pullPolicy: IfNotPresent
      # More than one replica requires fileStore.driver gcs or s3.
      replicaCount: 1
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 512Mi }
      livenessProbe:
        httpGet: { path: /healthz, port: http }
        periodSeconds: 20
        timeoutSeconds: 5
      readinessProbe:
        httpGet: { path: /readyz, port: http }
        periodSeconds: 10
        timeoutSeconds: 5
    # The gateway's invocation credential (DURABLE_ACTORS_SECRET), in its OWN
    # Secret so an invoke-only key replaces it with a values change only.
    # scope: admin means it is still a copy of the durable-actors admin
    # api-key (NOT release-grade: upstream has no invoke-only key yet);
    # invoke-only once the upstream scoped key exists.
    invocationSecret:
      name: ""
      key: durable-actors-invoke-key
      scope: admin
    # The durable-actors admin api-key: read ONLY by the deployer Job.
    adminKeySecret:
      name: actors-credentials
      key: api-key
    # Registers the Workspace actor bundle: a plain Job named by a hash of its
    # pod template (no Helm hook), so a new image or setting runs it again.
    deployer:
      enabled: true
      image:
        repository: ghcr.io/agentworkforce/relaycast-actors-deployer
        digest: ""
        tag: ""
        pullPolicy: IfNotPresent
      # The durable-actors storage.bucket (written through Workload Identity).
      artifactBucket: ""
      # Where compiled bundles are uploaded: gcs (Workload Identity) or s3 (the
      # default AWS chain, e.g. EKS Pod Identity on the deployer ServiceAccount;
      # pairs with durable-actors storage.provider=s3).
      artifactStore:
        driver: gcs
        s3:
          region: ""
          endpoint: ""
          forcePathStyle: false
      backoffLimit: 3
      # Upper bound on the whole Job (all retries), so a hung deploy fails.
      activeDeadlineSeconds: 3600
      serviceAccount:
        annotations: {}
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 1Gi }
    # Secrets in the durable-actors SANDBOX namespace, labelled
    # terse.ai/customer-secret=true, whose keys become actor env
    # (DURABLE_ACTORS_SECRET_REFS): RELAYCAST_PUBLIC_URL (= baseUrl),
    # RELAYCAST_FILE_SIGNING_SECRET, RELAYCAST_INTERNAL_SECRET and optional
    # engine settings. Operator-provided; the chart never renders secret values.
    actorEnvSecrets: [relaycast-actor-env]
    # Key in existingSecret for RELAYCAST_FILE_SIGNING_SECRET (same value as
    # the actor env secret's).
    fileSigningSecretKey: file-signing-secret
    # Where /_relayfiles bytes live. local needs persistence.* and one replica.
    fileStore:
      driver: gcs
      bucket: ""
      prefix: ""
      dir: /data/files
      s3:
        region: us-east-1
        endpoint: ""
        forcePathStyle: false
        # Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY; empty uses
        # the pod's ambient identity.
        existingSecret: ""
    maxUploadBytes: 67108864
    shutdownGraceMs: 10000
    logFormat: json
    # kind/CI only: a `durable-actors dev` sidecar in the gateway pod running
    # the Workspace actor (image: durable-actors TypeScript runtime + the
    # relaycast actor project). Actors inherit the sidecar's env, so the
    # sidecar gets RELAYCAST_PUBLIC_URL/FILE_SIGNING/INTERNAL directly. One
    # replica, no deployer; never for production.
    devRuntime:
      enabled: false
      acknowledgeNonProduction: false
      image:
        repository: ghcr.io/agentworkforce/relaycast-actors-dev
        digest: ""
        tag: ""
        pullPolicy: IfNotPresent
      port: 7100
      # Key in existingSecret holding the dev runtime's DURABLE_ACTORS_SECRET.
      secretKey: durable-actors-dev-secret
      resources:
        requests: { cpu: 200m, memory: 512Mi }
        limits: { memory: 2Gi }

# REQUIRED. Relaycast embeds this origin in signed file URLs and A2A cards.
# By default it must be an HTTPS origin with public, multi-label DNS, without a
# path. For a cluster-internal deployment set allowInsecureBaseUrl=true and use
# the Service name, e.g. http://relaycast.relaycast.svc:8787.
baseUrl: ""

# Accept an http:// baseUrl whose host is loopback or private (RFC 1918, ULA,
# *.svc, *.svc.cluster.local, single-label service names, ...). The image
# refuses public hosts over http. Not allowed together with ingress.enabled.
allowInsecureBaseUrl: false
# With allowInsecureBaseUrl: extra private DNS suffixes for a custom
# clusterDomain (RELAYCAST_PRIVATE_DNS_SUFFIXES), e.g. [".svc.corp"].
privateDnsSuffixes: []
# With allowInsecureBaseUrl: exact private hosts (RELAYCAST_INSECURE_BASE_URL_HOSTS),
# e.g. ["relaycast.relaycast"] for a <svc>.<ns> short name.
insecureBaseUrlHosts: []

# REQUIRED. Name of an existing Secret in the release namespace. The chart
# never renders a secret value; the keys below are mounted read-only as files
# under /run/secrets/relaycast and passed to the engine as *_FILE paths.
existingSecret: ""
secretKeys:
  # RELAYCAST_INTERNAL_SECRET_FILE: bearer secret (>= 32 characters) for the
  # in-cluster /internal admin API, used to create the first workspace.
  internalSecret: internal-secret
  # RELAYCAST_WORKSPACE_BOOTSTRAP_SECRET_FILE: stable derivation secret for
  # keyed workspace-create retries. Keep it stable across upgrades.
  bootstrapSecret: workspace-bootstrap-secret
  # RELAYCAST_CREDENTIAL_KEYRING_FILE (optional): local ar_ credential tag
  # keyring. Whenever it is mounted it takes precedence over the remote
  # tagger below; required with credentials.authority=self.
  credentialKeyring: ""
  # RELAYCAST_RELAYAUTH_TOKEN_FILE (optional): bearer token Relaycast
  # presents to RelayAuth's remote CredentialTagger. Required with
  # credentials.authority=relayauth and refused without
  # credentials.relayauth.url.
  relayauthToken: ""

# Workspace credential format and authority. The default issues and verifies
# legacy credentials locally. format=ar requires an authority:
#   authority=relayauth (model B): RelayAuth owns the ar_ tag keyring and
#     pushes ar_ws_ workspace keys into Relaycast; Relaycast verifies ar_ tags
#     through RelayAuth's remote CredentialTagger (RELAYCAST_RELAYAUTH_URL +
#     RELAYCAST_RELAYAUTH_TOKEN_FILE).
#   authority=self: Relaycast verifies ar_ tags against the local keyring
#     mounted via secretKeys.credentialKeyring.
# ar_ custody requires a >=12.3.x engine image. The pinned default (engine
# 12.7.0) satisfies it; no image.digest override is needed.
credentials:
  format: legacy
  authority: ""
  relayauth:
    url: ""

# Anonymous POST /v1/workspaces. Off by default: workspaces are created through
# the internal admin API (see the README's first-run section). Turning it on
# lets any caller that can reach the Service allocate workspaces, so it is
# refused together with ingress.enabled.
publicWorkspaceCreate: false

# Require bootstrap-secret proof for anonymous keyed creates.
bootstrapProofRequired: false

retention:
  # Empty keeps messages forever. Positive values set
  # RELAYCAST_MESSAGE_TTL_DAYS; zero and negative values are rejected.
  messageTtlDays: null

mailbox:
  # Empty values use Relaycast defaults.
  ttlMs: null
  depthCap: null

service:
  # ClusterIP only. Expose Relaycast publicly through ingress below, which
  # blocks the admin and workspace-create paths at the edge.
  type: ClusterIP
  port: 8787
  annotations: {}
  # GKE: name of a BackendConfig in this namespace (e.g. the agent-relay
  # umbrella's <gkeIngress.name>-cast); the chart renders the
  # cloud.google.com/backend-config annotation ({"default": "<name>"}) from
  # it. Its timeoutSec keeps WebSockets open past GCE's 30 s default.
  backendConfig: ""

# Optional public edge. Requires publicWorkspaceCreate=false and an HTTPS
# baseUrl whose host is listed in hosts. Every host routes Prefix "/" to
# Relaycast except two paths, which are routed to a Service with no endpoints
# so the controller answers 503 and the request never reaches the engine:
#   Prefix /internal        (admin API)
#   Exact  /v1/workspaces   (anonymous workspace creation)
# cert-manager: set annotations (e.g. cert-manager.io/cluster-issuer) and a
# tls entry with a secretName; cert-manager creates and renews that Secret.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # cert-manager.io/cluster-issuer: letsencrypt
  hosts: []
  # - relay.example.com
  # Required unless externalTls: the Ingress must serve HTTPS itself.
  tls: []
  # - secretName: relay-example-com-tls
  #   hosts: [relay.example.com]
  # Set true only when a load balancer in front of the controller terminates
  # TLS for these hosts (then tls may stay empty).
  externalTls: false

persistence:
  existingClaim: ""
  storageClass: ""
  # ReadWriteOnce is required when backup.enabled: the backup pod is scheduled
  # onto the Relaycast pod's node and mounts the same claim.
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations:
    helm.sh/resource-policy: keep

# Scheduled online backups of the SQLite database (SQLite backup API, safe
# while the engine runs) and the uploaded-file directory to a second PVC.
# See the README for the restore procedure.
backup:
  enabled: false
  schedule: "17 3 * * *"
  # Number of backups kept on the backup volume; older ones are pruned.
  keep: 7
  existingClaim: ""
  storageClass: ""
  size: 20Gi
  annotations:
    helm.sh/resource-policy: keep
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 3600

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 2
  timeoutSeconds: 1

livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 20
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5

networkPolicy:
  enabled: true
  # Empty allows callers only from the release namespace. With ingress enabled,
  # list the ingress controller's namespace/pods here (required).
  ingressFrom: []

terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Additional non-secret environment variables. Names managed by the structured
# values above are reserved and rejected here.
extraEnv: []
