# ar_ credentials with RelayAuth as the credential authority (model B):
# Relaycast verifies ar_ tags through RelayAuth's remote CredentialTagger.
baseUrl: http://ci-relaycast.ci.svc:8787
allowInsecureBaseUrl: true
existingSecret: relaycast-secrets
credentials:
  format: ar
  authority: relayauth
  relayauth:
    url: http://relayauth.ci.svc:8787
secretKeys:
  relayauthToken: relaycast-relayauth-token
