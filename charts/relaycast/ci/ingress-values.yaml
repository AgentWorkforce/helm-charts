baseUrl: https://relay.example.com
ingress:
  enabled: true
  className: nginx
  hosts:
    - relay.example.com
  tls:
    - secretName: relay-example-com-tls
      hosts:
        - relay.example.com
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/component: controller
