{{- include "96bulls-worker.validate" . -}}
{{- if .Values.networkPolicy.enabled }}
# Worker pods only dial out (database, object storage, workload identity,
# cluster DNS, optional OTLP): no Service ever selects them, so ingress stays
# fully denied and each egress destination must be listed explicitly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "96bulls-worker.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "96bulls-worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "96bulls-worker.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- range $name := list "dns" "database" "objectStorage" "workloadIdentity" "observability" }}
    {{- $rule := index $.Values.networkPolicy $name | default dict }}
    {{- if or ($rule.to) ($rule.ports) }}
    - to: {{ if $rule.to }}{{ toYaml $rule.to | nindent 10 }}{{ else }}[]{{ end }}
      ports: {{ if $rule.ports }}{{ toYaml $rule.ports | nindent 10 }}{{ else }}[]{{ end }}
    {{- end }}
    {{- end }}
{{- end }}
