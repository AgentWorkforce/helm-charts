{{- if .Values.externalSecrets.enabled }}
{{- if not .Values.externalSecrets.secretStoreRef.name }}{{ fail "96bulls-worker: externalSecrets.secretStoreRef.name is required when externalSecrets.enabled" }}{{ end }}
{{- if not .Values.existingSecret }}{{ fail "96bulls-worker: existingSecret is required when externalSecrets.enabled (it is the target Secret name)" }}{{ end }}
{{- $required := list }}
{{- if eq (.Values.locker.credentials.mode | default "secret") "secret" }}
{{- $required = append $required .Values.secretKeys.lockerAccessKeyId }}
{{- $required = append $required .Values.secretKeys.lockerSecretAccessKey }}
{{- end }}
{{- if not .Values.hoopdb.existingSecret }}{{ $required = append $required (.Values.hoopdb.key | default .Values.secretKeys.hoopdbUrl) }}{{ end }}
{{- $runtimeSecret := .Values.hoopdb.existingSecret | default .Values.existingSecret }}
{{- $runtimeKey := .Values.hoopdb.key | default .Values.secretKeys.hoopdbUrl }}
{{- $migrationSecret := .Values.migrations.hoopdb.existingSecret | default $runtimeSecret }}
{{- $migrationKey := .Values.migrations.hoopdb.key | default $runtimeKey }}
{{- if eq $migrationSecret .Values.existingSecret }}{{ $required = append $required $migrationKey }}{{ end }}
{{- $bob := index .Values.components "bob-costas" }}
{{- $summarySecret := .Values.summaryEncryption.existingSecret | default .Values.existingSecret }}
{{- if and $bob.enabled (eq $summarySecret .Values.existingSecret) }}{{ $required = append $required .Values.summaryEncryption.key }}{{ end }}
{{- range $required }}{{ if not (hasKey $.Values.externalSecrets.data .) }}{{ fail (printf "96bulls-worker: externalSecrets.data must map %s" .) }}{{ end }}{{ end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "96bulls-worker.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "96bulls-worker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: {{ .Values.externalSecrets.creationPolicy }}
  data:
    {{- range $k, $ref := .Values.externalSecrets.data }}
    - secretKey: {{ $k }}
      remoteRef:
        {{- toYaml $ref | nindent 8 }}
    {{- end }}
{{- end }}
