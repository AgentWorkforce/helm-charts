{{- if .Values.externalSecrets.enabled }}
{{- if not .Values.externalSecrets.secretStoreRef.name }}{{ fail "96bulls-worker: externalSecrets.secretStoreRef.name is required when externalSecrets.enabled" }}{{ end }}
{{- $required := list .Values.secretKeys.lockerAccessKeyId .Values.secretKeys.lockerSecretAccessKey }}
{{- if not .Values.hoopdb.existingSecret }}{{ $required = append $required (.Values.hoopdb.key | default .Values.secretKeys.hoopdbUrl) }}{{ end }}
{{- range $required }}{{ if not (hasKey $.Values.externalSecrets.data .) }}{{ fail (printf "96bulls-worker: externalSecrets.data must map %s" .) }}{{ end }}{{ end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "96bulls-worker.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "96bulls-worker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: {{ .Values.externalSecrets.creationPolicy }}
  data:
    {{- range $k, $ref := .Values.externalSecrets.data }}
    - secretKey: {{ $k }}
      remoteRef:
        {{- toYaml $ref | nindent 8 }}
    {{- end }}
{{- end }}
