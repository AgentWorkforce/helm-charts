## Default values for 96bulls-worker.
## Secrets are NEVER set here: point existingSecret at a Secret you create.

global:
  # Registry prefixed to relative image.repository values. The default image
  # repository is private and requires imagePullSecrets outside hosted EKS.
  imageRegistry: ghcr.io
  otel:
    # OTLP/HTTP endpoint; rendered as OTEL_EXPORTER_OTLP_ENDPOINT. Empty = unset.
    endpoint: ""

# One image for every component; SERVICE= selects the entry point.
image:
  repository: agentworkforce/96bulls-services
  # Defaults to Chart.appVersion when empty.
  tag: ""
  # sha256 digest; when set it wins over tag. Default: the services image
  # built from 96BullSessions main 7d7229b (#124 + #125 + #139 + #137; GHCR publish-image run
  # 41375745173; migration generation eff8b3be...259b). This hosted
  # service package is private: add imagePullSecrets for direct installs.
  # When overriding repository or tag, clear digest or set a matching digest.
  digest: "sha256:6f22ea17dff336e1431664542759fd27958649388b90a0b2f0881883caa7c6b2"
  pullPolicy: IfNotPresent

# Optional; passed to every workload and Job.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Secret containing Locker credentials in secret mode and, unless
# hoopdb.existingSecret is set, HOOPDB_URL. May be empty in podIdentity mode
# when HoopDb uses its own Secret.
existingSecret: ""
secretKeys:
  hoopdbUrl: HOOPDB_URL
  lockerAccessKeyId: LOCKER_ACCESS_KEY_ID
  lockerSecretAccessKey: LOCKER_SECRET_ACCESS_KEY

# Bob Costas encrypts summary objects before they reach the Locker. The value
# is never accepted in values.yaml: it is read from a Kubernetes Secret and is
# projected as a read-only file into Bob Costas only. Empty existingSecret
# falls back to the shared existingSecret above; set it explicitly when using
# pod identity without a shared application Secret.
summaryEncryption:
  existingSecret: ""
  key: SUMMARY_MASTER_KEYS
  mountPath: /var/run/secrets/96bulls
  fileName: summary-master-keys

# Non-secret environment shared by every component (names are the services'
# env contract; do not rename).
locker:
  # s3 (default): S3-compatible store (MinIO, AWS S3). gcs: native Google Cloud
  # Storage through GKE Workload Identity; renders LOCKER_PROVIDER=gcs and
  # PIPELINE_RAW_PROVIDER=gcs and requires credentials.mode=podIdentity and an
  # empty (or https://storage.googleapis.com) endpoint. The services refuse
  # HMAC keys on GCS and the S3 client against storage.googleapis.com, so
  # "GCS as S3 with HMAC keys" is not supported. gcs also arms the services'
  # GCS data-path readiness check: extraEnv must carry
  # CLOUD_SQL_CONNECTION_NAME, REDIS_HOST, REDIS_PORT, REDIS_AUTH_ENABLED
  # ("false"), REDIS_TRANSIT_ENCRYPTION ("SERVER_AUTHENTICATION"),
  # REDIS_TLS_CA_PEM, PUBSUB_TOPIC and PUBSUB_SUBSCRIPTION.
  provider: s3
  # Required in secret mode, e.g. http://minio:9000. In podIdentity mode,
  # leave empty to use the provider's native endpoint (S3: for locker.region).
  endpoint: ""
  bucket: locker
  region: us-east-1
  credentials:
    # secret reads LOCKER_* keys from existingSecret; podIdentity omits both
    # static credential environment variables so the AWS SDK can use its
    # workload identity credential chain.
    mode: secret
tenant:
  orgId: ""           # REQUIRED
  workspaceId: default
deployment:
  name: selfhost      # DEPLOYMENT
  id: ""              # DEPLOYMENT_ID; defaults to the release namespace/name
environment: production
# ALLOW_IN_CLUSTER_HTTP for every component. false (default): service URLs
# must be https (or loopback). true allows plain http only to in-cluster
# Service FQDNs (<svc>.<ns>.svc[.cluster.local]), never public hosts, IPs or
# short names.
allowInClusterHttp: false
# Extra env for every component: [{ name: X, value: y }].
extraEnv: []

# OPTIONAL: read HOOPDB_URL from a different Secret than existingSecret, e.g.
# the "<cluster>-app" Secret CloudNativePG generates (key "uri"). Empty =
# existingSecret / secretKeys.hoopdbUrl.
hoopdb:
  existingSecret: ""
  key: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
automountServiceAccountToken: false

# HoopDb migrations: a plain Job (no Helm hook). Its name carries a hash of the
# image and this block, so a new image creates a new Job and the old one is
# pruned. There is deliberately no ttlSecondsAfterFinished: Alchemy treats a
# deleted object as drift and would recreate (re-run) the Job.
migrations:
  enabled: true
  # Optional migration-owner connection. When set, only the migrate Job reads
  # this Secret/key; every long-running workload keeps using hoopdb above.
  # Set both fields together. Empty preserves the historical shared URL.
  hoopdb:
    existingSecret: ""
    key: ""
  # The migrator's database profile (96BullSessions src/hoopdb/migrate.ts
  # migrationProfile(), 96BullSessions #99). Each value is rendered at most once,
  # into the migrate container only. Do not set these via extraEnv or component
  # env; the render refuses that. Where the migrator has no default, neither does
  # the chart: an unset required value fails the render.
  # REQUIRED. HOOPDB_DB_MODE: local | selfhosted (CNPG, RDS, any
  # operator-controlled plain Postgres) | cloudsql (Google Cloud SQL) | supabase.
  databaseMode: ""
  # HOOPDB_ROLE_BOOTSTRAP (optional): true/false; the migrator defaults it to the
  # shim choice. Refused as true in supabase mode. Cloud SQL sets false (no
  # customer superuser; the operator provisions the search Worker role).
  roleBootstrap: null
  # HOOPDB_SUPABASE_SHIM: true/false. Required in local, selfhosted and cloudsql
  # (Cloud SQL: false; its operator bootstrap creates the compatibility roles). In
  # supabase mode it must be unset or false and is rendered "false". The
  # migrator also refuses the shim and the role bootstrap there.
  supabaseShim: null
  # REQUIRED. HOOPDB_RUNTIME_ROLE: the role the services connect as. Outside
  # local mode it must be a dedicated role, not the migration owner.
  runtimeRole: ""
  # HOOPDB_RUNTIME_ROLE_LOGIN: true/false. Required outside local mode; rendered
  # only when set.
  runtimeRoleLogin: null
  # HOOPDB_RUNTIME_WORKLOAD_ROLE (optional): the one role allowed to be a member
  # of the runtime role.
  runtimeWorkloadRole: ""
  # HOOPDB_FUNCTION_BOUNDARY_MODE: global-default-revoke or, in supabase mode
  # only, event-trigger (96BullSessions #125); the chart refuses event-trigger
  # elsewhere, as the migrator does. Required in selfhosted and cloudsql mode
  # (global-default-revoke): the database is dedicated to HoopDb, and the
  # privileged supabase/bootstrap/hoopdb_function_default_revoke.sql installs
  # the control. Optional in supabase mode, where the operator installs
  # supabase/bootstrap/hoopdb_sessions_function_boundary_supabase.sql for
  # event-trigger; unset, the migrator's function-boundary gate fails closed.
  # The old name, HOOPDB_FUNCTION_BOUNDARY_APPROVED, is refused.
  functionBoundaryMode: ""
  backoffLimit: 3
  activeDeadlineSeconds: 3600
  # Opt-in TTL for plain `helm install` users only. Leave 0 under Alchemy.
  ttlSecondsAfterFinished: 0
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  # Orders the migrate Job after the privileged bootstraps without Helm hooks
  # (Alchemy renders --no-hooks). An init container polls HoopDb (HOOPDB_URL)
  # until `role` and, outside local mode, runtimeRole exist. With
  # functionDefault, it also waits until the migration owner's global function
  # default is exactly {<owner>:EXECUTE}, the state the default-revoke bootstrap
  # leaves. The migrator then verifies all of it itself. Refused in supabase
  # mode: there the roles are operator steps, and the migrator refuses on its own.
  # Needs an image with sh and psql, by digest. Bounded by activeDeadlineSeconds.
  waitForRole:
    enabled: false
    role: session_directory_search_worker
    functionDefault: false
    # Full reference with @sha256 digest, e.g. the CNPG Postgres image.
    image: ""
    intervalSeconds: 5
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }

# Creates the Locker bucket (idempotent). Replaces upstream MinIO's
# post-install bucket hook, which never runs under --no-hooks.
lockerInit:
  enabled: true
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 0
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }

# Worker health server (each stage worker; no Service, probes only).
#   /readyz  200 once HoopDb answers and the migration ledger is complete;
#            503 again after `unhealthyAfterFailures` consecutive failed
#            HoopDb checks.
#   /healthz 200 ("starting") during a long migration, so liveness never kills
#            a worker for waiting; 503 after `unhealthyAfterFailures` failed
#            checks or a work loop stalled longer than `maxTickAgeMs`.
# A liveness restart re-reads env, so a rotated HOOPDB_URL Secret is picked up.
workerHealth:
  enabled: true
  port: 8081
  unhealthyAfterFailures: 5
  maxTickAgeMs: 120000
  startupProbe:
    httpGet: { path: /readyz, port: health }
    periodSeconds: 15
    # ~1h: a slow migration must never restart a worker.
    failureThreshold: 240
  readinessProbe:
    httpGet: { path: /readyz, port: health }
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  livenessProbe:
    httpGet: { path: /healthz, port: health }
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

# Stage workers. Each blocks at start until HoopDb answers and the migration
# ledger is complete, so apply order does not matter.
components:
  hoopdb-indexer:
    enabled: true
    # Keep at 1: the manifest reconcile is not leader-elected yet.
    replicas: 1
    env: []
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
  referee:
    enabled: true
    replicas: 1
    env: []
    resources:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { memory: 384Mi }
  bob-costas:
    enabled: true
    replicas: 1
    env:
      - name: BOB_COSTAS_MODEL
        value: "off"
    resources:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { memory: 384Mi }

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}

# Network isolation is opt-in for portable installs because the chart cannot
# infer the CIDRs of an external database/object store or a cluster's DNS and
# workload-identity endpoints. When enabled, every destination the worker and
# migration pods need must be listed explicitly; egress is otherwise denied.
# An empty `to` would match every destination, so rendering fails when dns,
# database or objectStorage (plus workloadIdentity in podIdentity mode and
# observability when global.otel.endpoint is set) has no `to` entries. Rules
# with destinations but no ports allow every port to those destinations.
#
# Kubernetes NetworkPolicy has no FQDN matching. For GCS, use customer DNS
# that maps googleapis.com to private.googleapis.com (199.36.153.8/30) or
# restricted.googleapis.com (199.36.153.4/30), then allow that chosen VIP.
# Cloud SQL private-service-access ranges and cluster DNS addresses are
# customer/VPC specific and must never be guessed here.
networkPolicy:
  enabled: false
  dns:
    to: []
    ports:
      - { protocol: UDP, port: 53 }
      - { protocol: TCP, port: 53 }
  database:
    to: []
    ports:
      - { protocol: TCP, port: 5432 }
  objectStorage:
    to: []
    ports:
      - { protocol: TCP, port: 443 }
  # Required in podIdentity mode. GKE Dataplane V1 commonly uses
  # 169.254.169.252/32:988; Dataplane V2 uses 169.254.169.254/32:80.
  # Select the endpoint actually used by the customer cluster.
  workloadIdentity:
    to: []
    ports: []
  # Optional OTLP destination. Required when global.otel.endpoint is nonempty.
  observability:
    to: []
    ports: []

# OPTIONAL: External Secrets Operator (e.g. a 1Password ClusterSecretStore).
# Off by default; customers create existingSecret themselves. When enabled the
# chart renders an ExternalSecret (named after the release) whose target IS
# existingSecret, so workloads are unchanged. Every credential key consumed
# from that target, including summaryEncryption.key when it follows
# existingSecret, must be mapped in data. Remote key names only, never values.
externalSecrets:
  enabled: false
  refreshInterval: 1h
  # Owner: this release owns the target Secret. When 96bulls-worker and
  # alleyoop share one existingSecret, enable ESO in both only if the second
  # uses Merge (or enable it in just one release).
  creationPolicy: Owner
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  # Secret key -> remote reference, e.g.
  # HOOPDB_URL: { key: 96bulls-hoopdb, property: url }
  data: {}
