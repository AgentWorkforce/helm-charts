existingSecret: sessions-pipeline-database
locker:
  endpoint: ""
  bucket: sessions-pipeline-ci
  region: us-west-2
  credentials:
    mode: podIdentity
tenant:
  orgId: org_ci
externalSecrets:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  data:
    HOOPDB_URL: { key: sessions-pipeline-hoopdb, property: url }
    SUMMARY_MASTER_KEYS: { key: sessions-pipeline-summary, property: master-keys }
migrations:
  databaseMode: selfhosted
  supabaseShim: true
  runtimeRole: sessions_pipeline_runtime
  runtimeRoleLogin: true
  functionBoundaryMode: global-default-revoke
