# Optional External Secrets path (e.g. a 1Password ClusterSecretStore).
existingSecret: sessions-pipeline
locker:
  endpoint: http://locker:9000
tenant:
  orgId: org_ci
externalSecrets:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  data:
    HOOPDB_URL: { key: sessions-pipeline-hoopdb, property: url }
    LOCKER_ACCESS_KEY_ID: { key: sessions-pipeline-locker, property: access-key-id }
    LOCKER_SECRET_ACCESS_KEY: { key: sessions-pipeline-locker, property: secret-access-key }
    SUMMARY_MASTER_KEYS: { key: sessions-pipeline-summary, property: master-keys }
migrations:
  databaseMode: selfhosted
  supabaseShim: true
  runtimeRole: sessions_pipeline_runtime
  runtimeRoleLogin: true
  functionBoundaryMode: global-default-revoke
