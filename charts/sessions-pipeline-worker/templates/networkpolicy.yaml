{{- include "sessions-pipeline-worker.validate" . -}}
{{- if .Values.networkPolicy.enabled }}
{{- /* An empty or omitted NetworkPolicy `to` matches every destination, so a
rule without destinations would allow its ports to any IP. Required
destinations fail closed instead; a rule is rendered only with destinations. */ -}}
{{- $required := list "dns" "database" "objectStorage" -}}
{{- if eq (.Values.locker.credentials.mode | default "secret") "podIdentity" }}{{ $required = append $required "workloadIdentity" }}{{ end -}}
{{- if .Values.global.otel.endpoint }}{{ $required = append $required "observability" }}{{ end -}}
{{- range $name := $required }}
{{- if empty (dig "to" (list) (index $.Values.networkPolicy $name | default dict)) }}{{ fail (printf "sessions-pipeline-worker: networkPolicy.%s.to must list destinations when networkPolicy.enabled=true (an empty to would allow every destination)" $name) }}{{ end -}}
{{- end }}
# Worker pods only dial out (database, object storage, workload identity,
# cluster DNS, optional OTLP): no Service ever selects them, so ingress stays
# fully denied and each egress destination must be listed explicitly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sessions-pipeline-worker.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "sessions-pipeline-worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "sessions-pipeline-worker.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  {{- $rules := list }}
  {{- range $name := list "dns" "database" "objectStorage" "workloadIdentity" "observability" }}
  {{- $rule := index $.Values.networkPolicy $name | default dict }}
  {{- if $rule.to }}
  {{- $entry := dict "to" $rule.to }}
  {{- if $rule.ports }}{{ $_ := set $entry "ports" $rule.ports }}{{ end }}
  {{- $rules = append $rules $entry }}
  {{- end }}
  {{- end }}
  {{- if $rules }}
  egress: {{ toYaml $rules | nindent 4 }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
