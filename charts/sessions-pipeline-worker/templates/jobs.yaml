{{- include "sessions-pipeline-worker.validate" . -}}
{{- $jobs := list -}}
{{- if .Values.migrations.enabled }}{{ $jobs = append $jobs (dict "job" "migrate" "service" "hoopdb-migrate" "config" .Values.migrations) }}{{ end -}}
{{- if .Values.lockerInit.enabled }}{{ $jobs = append $jobs (dict "job" "locker-init" "service" "locker-init" "config" .Values.lockerInit) }}{{ end -}}
{{- range $jobs }}
{{- $spec := include "sessions-pipeline-worker.jobSpec" (dict "context" $ "job" .job "service" .service "config" .config) }}
---
# Plain Job, not a Helm hook. Name is content-addressed; see _names.tpl.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sessions-pipeline-worker.jobName" (dict "context" $ "job" .job "spec" $spec) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "sessions-pipeline-worker.componentLabels" (dict "context" $ "component" .service) | nindent 4 }}
spec:
  {{- $spec | nindent 2 }}
{{- end }}
