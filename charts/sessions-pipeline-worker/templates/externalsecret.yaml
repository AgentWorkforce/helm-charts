{{- if .Values.externalSecrets.enabled }}
{{- if not .Values.externalSecrets.secretStoreRef.name }}{{ fail "sessions-pipeline-worker: externalSecrets.secretStoreRef.name is required when externalSecrets.enabled" }}{{ end }}
{{- if not .Values.existingSecret }}{{ fail "sessions-pipeline-worker: existingSecret is required when externalSecrets.enabled (it is the target Secret name)" }}{{ end }}
{{- $required := list }}
{{- if eq (.Values.locker.credentials.mode | default "secret") "secret" }}
{{- $required = append $required .Values.secretKeys.lockerAccessKeyId }}
{{- $required = append $required .Values.secretKeys.lockerSecretAccessKey }}
{{- end }}
{{- if not .Values.hoopdb.existingSecret }}{{ $required = append $required (.Values.hoopdb.key | default .Values.secretKeys.hoopdbUrl) }}{{ end }}
{{- $runtimeSecret := .Values.hoopdb.existingSecret | default .Values.existingSecret }}
{{- $runtimeKey := .Values.hoopdb.key | default .Values.secretKeys.hoopdbUrl }}
{{- $migrations := .Values.migrations | default dict }}
{{- $migrationHoopdb := get $migrations "hoopdb" | default dict }}
{{- $migrationSecret := get $migrationHoopdb "existingSecret" | default $runtimeSecret }}
{{- $migrationKey := get $migrationHoopdb "key" | default $runtimeKey | toString }}
{{- if and (get $migrations "enabled") (eq $migrationSecret .Values.existingSecret) }}{{ $required = append $required $migrationKey }}{{ end }}
{{- $bob := index .Values.components "bob-costas" }}
{{- $summarySecret := .Values.summaryEncryption.existingSecret | default .Values.existingSecret }}
{{- if and $bob.enabled (eq $summarySecret .Values.existingSecret) }}{{ $required = append $required .Values.summaryEncryption.key }}{{ end }}
{{- range $required }}{{ if not (hasKey $.Values.externalSecrets.data .) }}{{ fail (printf "sessions-pipeline-worker: externalSecrets.data must map %s" .) }}{{ end }}{{ end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sessions-pipeline-worker.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "sessions-pipeline-worker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: {{ .Values.externalSecrets.creationPolicy }}
  data:
    {{- range $k, $ref := .Values.externalSecrets.data }}
    - secretKey: {{ $k }}
      remoteRef:
        {{- toYaml $ref | nindent 8 }}
    {{- end }}
{{- end }}
