replicaCount: 1

image:
  repository: ghcr.io/agentworkforce/relay-dashboard
  # Required. Images are never selected by a mutable tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Runtime configuration consumed by the dashboard container.
runtime:
  publicUrl: ""
  appPath: /
  apiBasePath: /cloud/api
  loginPath: /login

# A leaf Ingress can proxy /cloud/api to this Service. The GKE proof uses the
# umbrella Ingress instead and leaves this ingress disabled. Required when
# ingress.enabled=true: the relay-cloud-api Service name in this namespace,
# i.e. its fullname (<release>-relay-cloud-api unless fullnameOverride is set).
api:
  serviceName: ""
  servicePort: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
  externalTls: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { memory: 128Mi }

startupProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 2
  failureThreshold: 30
livenessProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 20
readinessProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 10

networkPolicy:
  enabled: true
  ingressFrom: []

terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
