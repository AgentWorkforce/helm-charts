replicaCount: 1

image:
  repository: ghcr.io/agentworkforce/relay-dashboard
  # Required. Images are never selected by a mutable tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Runtime configuration consumed by the dashboard container. Leave publicUrl
# empty in single-host mode: it is derived as https://<global.singleHost.host>.
runtime:
  publicUrl: ""
  appPath: /
  apiBasePath: /cloud/api
  loginPath: /login

# Optional enterprise branding: one customer profile, rendered as JSON into
# DASHBOARD_CUSTOMER_PROFILE and served in /runtime-config.js (no rebuild).
# Empty keeps the Agent Relay look. Fields (all optional): productName, title,
# logo ({light, dark} or one URL), favicon, accentColor, brandColor,
# supportUrl, poweredByAgentRelay (default true under a custom brand).
# See the README "Customer profile" section.
customerProfile: {}

# A leaf Ingress can proxy /cloud/api to this Service. The GKE proof uses the
# umbrella Ingress instead and leaves this ingress disabled. Required when
# ingress.enabled=true: the relay-cloud-api Service name in this namespace,
# i.e. its fullname (<release>-relay-cloud-api unless fullnameOverride is set).
api:
  serviceName: ""
  servicePort: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Derived from global.singleHost.host in single-host mode.
  host: ""
  tls: []
  externalTls: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { memory: 128Mi }

startupProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 2
  failureThreshold: 30
livenessProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 20
readinessProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 10

networkPolicy:
  enabled: true
  ingressFrom: []

terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Single-host mode, normally set once on the agent-relay umbrella: the
# dashboard and the control API share this host. runtime.publicUrl and
# ingress.host are derived from it, and the leaf Ingress also routes /api to
# the API (next to apiBasePath and loginPath).
global:
  singleHost:
    host: ""
