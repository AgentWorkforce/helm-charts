{{- include "relayauth.validate" . }}
{{- $keys := .Values.secretKeys }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relayauth.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relayauth.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "relayauth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "relayauth.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "relayauth.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: relayauth
          image: {{ include "relayauth.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.server.port | quote }}
            - name: RELAYAUTH_DB_PATH
              value: /data/relayauth.db
            - name: BASE_URL
              value: {{ include "relayauth.baseUrl" . | quote }}
            - name: RELAYAUTH_ISSUER
              value: {{ include "relayauth.issuer" . | quote }}
            {{- if .Values.relayhistory.allowPrivateHttpOrigin }}
            - name: RELAYAUTH_ALLOW_PRIVATE_HTTP_HISTORY_ORIGIN
              value: "true"
            {{- end }}
            {{- with .Values.cors.allowedOrigins }}
            - name: ALLOWED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            - name: INTERNAL_SECRET_FILE
              value: /run/secrets/relayauth/{{ $keys.internalSecret }}
            - name: RELAYAUTH_SIGNING_KEY_PEM_FILE
              value: /run/secrets/relayauth/{{ $keys.signingKey }}
            {{- with $keys.signingKeyPublic }}
            - name: RELAYAUTH_SIGNING_KEY_PEM_PUBLIC_FILE
              value: /run/secrets/relayauth/{{ . }}
            {{- end }}
            {{- with $keys.signingKeyNext }}
            - name: RELAYAUTH_SIGNING_KEY_PEM_NEXT_FILE
              value: /run/secrets/relayauth/{{ . }}
            {{- end }}
            {{- with $keys.signingKeyPrevious }}
            - name: RELAYAUTH_SIGNING_KEY_PEM_PREVIOUS_FILE
              value: /run/secrets/relayauth/{{ . }}
            {{- end }}
            {{- with $keys.bootstrapApiKey }}
            - name: RELAYAUTH_BOOTSTRAP_API_KEY_FILE
              value: /run/secrets/relayauth/{{ . }}
            - name: RELAYAUTH_BOOTSTRAP_API_KEY_ORG
              value: {{ $.Values.relayhistory.bootstrapApiKeyOrg | quote }}
            {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: secrets
              mountPath: /run/secrets/relayauth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "relayauth.claimName" . }}
        - name: secrets
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
