{{- include "relayauth.validate" . }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "relayauth.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relayauth.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "relayauth.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
