{{- include "relay-cloud-api.validate" . }}
{{- if .Values.migrations.enabled }}
{{- $podTemplate := include "relay-cloud-api.migrationPodTemplate" . }}
{{- /* Job spec.template is immutable: any pod template change must yield a new
Job name, so the identity hashes the fully rendered template. */}}
{{- $identity := printf "%s|%s" $podTemplate .Values.migrations.identitySalt | sha256sum | trunc 8 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate-%s" (include "relay-cloud-api.fullname" . | trunc 45 | trimSuffix "-") $identity }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relay-cloud-api.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template: {{- $podTemplate | nindent 4 }}
{{- end }}
