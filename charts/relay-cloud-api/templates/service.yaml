{{- include "relay-cloud-api.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "relay-cloud-api.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "relay-cloud-api.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.service.annotations | default dict) }}
  {{- $backendConfig := .Values.service.backendConfig }}
  {{- if not (or (kindIs "invalid" $backendConfig) (and (kindIs "string" $backendConfig) (eq $backendConfig ""))) }}
  {{- if not (and (kindIs "string" $backendConfig) (le (len (toString $backendConfig)) 253) (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" (toString $backendConfig))) }}{{ fail "service.backendConfig must be a BackendConfig name (DNS-1123 subdomain, at most 253 characters)" }}{{ end }}
  {{- if hasKey $annotations "cloud.google.com/backend-config" }}{{ fail "set service.backendConfig or service.annotations.cloud.google.com/backend-config, not both" }}{{ end }}
  {{- $_ := set $annotations "cloud.google.com/backend-config" (dict "default" $backendConfig | toJson) }}
  {{- end }}
  {{- with $annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
  selector: {{ include "relay-cloud-api.selectorLabels" . | nindent 4 }}
