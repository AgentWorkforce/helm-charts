apiVersion: v2
name: relaycast-cloud
type: application
version: 0.1.0
# appVersion tracks the default image tag (the @relaycast/engine version the
# image installs). Pin image.digest in your values for reproducible deployments.
appVersion: "12.1.0"
description: >
  RelayCast Cloud: a multi-tenant, self-hostable RelayCast engine (headless
  Slack for agents). Each tenant is a RelayCast workspace. Runs without
  Cloudflare; the Cloudflare deployment (relaycast-cloud/SST) remains an
  optional, recommended alternative.
home: https://github.com/AgentWorkforce/relaycast
keywords:
  - relaycast
  - messaging
  - agents
  - agentworkforce
maintainers:
  - name: AgentWorkforce
    url: https://github.com/AgentWorkforce/helm-charts
sources:
  - https://github.com/AgentWorkforce/helm-charts/tree/main/charts/relaycast-cloud
  - https://github.com/AgentWorkforce/relaycast
# Backends for the Postgres/MinIO path. All are off by default: the engine is
# SQLite-only today, and the templates refuse to render postgres/objectStorage
# modes until the engine ships Postgres and S3 adapters. Pins are shared with
# the 96BullSessions charts.
dependencies:
  - name: cloudnative-pg
    version: 0.29.1
    repository: https://cloudnative-pg.github.io/charts
    condition: cloudnative-pg.enabled
  - name: cluster
    alias: postgres
    version: 0.9.0
    repository: https://cloudnative-pg.github.io/charts
    condition: postgres.enabled
  - name: minio
    version: 5.4.0
    repository: https://charts.min.io/
    condition: minio.enabled
  - name: opentelemetry-collector
    version: 0.178.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: opentelemetry-collector.enabled
