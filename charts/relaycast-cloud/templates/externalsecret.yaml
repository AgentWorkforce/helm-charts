{{- /*
Optional External Secrets Operator path (e.g. a 1Password-backed
ClusterSecretStore). Off by default. The chart renders only the ExternalSecret
reference; ESO writes the target Secret, which the chart never renders.
*/ -}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "relaycast-cloud.secretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relaycast-cloud.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ include "relaycast-cloud.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.keys.workspaceBootstrapSecret }}
      remoteRef:
        key: {{ .Values.externalSecrets.data.workspaceBootstrapSecret.key | quote }}
        {{- with .Values.externalSecrets.data.workspaceBootstrapSecret.property }}
        property: {{ . | quote }}
        {{- end }}
{{- end }}
