{{- /*
Optional External Secrets Operator path (e.g. a 1Password-backed
ClusterSecretStore). Off by default. The chart renders only the ExternalSecret;
ESO writes the target Secret (existingSecret), which the chart never renders.
*/ -}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "relaycast-cloud.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relaycast-cloud.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: {{ .Values.externalSecrets.creationPolicy }}
  data:
    {{- range $k, $ref := .Values.externalSecrets.data }}
    - secretKey: {{ $k }}
      remoteRef:
        {{- toYaml $ref | nindent 8 }}
    {{- end }}
{{- end }}
