{{- include "relaycast-cloud.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relaycast-cloud.server.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relaycast-cloud.componentLabels" (dict "context" . "component" "server") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # SQLite on a ReadWriteOnce volume: the old pod must release the volume
  # before the new one starts, so rolling updates are not possible.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "relaycast-cloud.componentSelectorLabels" (dict "context" . "component" "server") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "relaycast-cloud.componentSelectorLabels" (dict "context" . "component" "server") | nindent 8 }}
    spec:
      {{- include "relaycast-cloud.images.pullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "relaycast-cloud.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "relaycast-cloud.images.server" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image entrypoint migrates the SQLite schema on boot, then serves.
          args:
            - --base-url
            - {{ .Values.relaycast.baseUrl | quote }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.relaycast.port }}
              protocol: TCP
          env:
            {{- include "relaycast-cloud.server.env" . | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "relaycast-cloud.claimName" . }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
