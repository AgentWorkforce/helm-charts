apiVersion: v1
kind: Service
metadata:
  name: {{ include "relaycast-cloud.server.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relaycast-cloud.componentLabels" (dict "context" . "component" "server") | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "relaycast-cloud.componentSelectorLabels" (dict "context" . "component" "server") | nindent 4 }}
