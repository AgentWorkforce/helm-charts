relaycast:
  baseUrl: https://relay.example.com
  workspaces:
    bootstrapProofRequired: true
persistence:
  existingClaim: relaycast-data
existingSecret: relaycast-secrets
externalSecrets:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  data:
    RELAYCAST_WORKSPACE_BOOTSTRAP_SECRET:
      key: relaycast-cloud
      property: workspace-bootstrap-secret
opentelemetry-collector:
  enabled: true
