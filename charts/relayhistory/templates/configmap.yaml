{{- include "relayhistory.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "relayhistory.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "relayhistory.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.server.port | quote }}
  ENVIRONMENT: {{ .Values.server.environment | quote }}
  MAX_BODY_BYTES: {{ .Values.server.maxBodyBytes | int64 | quote }}
  {{- with .Values.server.maxInflightBodyBytes }}
  MAX_INFLIGHT_BODY_BYTES: {{ . | int64 | quote }}
  {{- end }}
  SHUTDOWN_GRACE_MS: {{ mul (max 1 (sub (int .Values.terminationGracePeriodSeconds) 5)) 1000 | quote }}
  SHUTDOWN_DRAIN_DELAY_MS: {{ mul (int .Values.server.shutdownDrainDelaySeconds) 1000 | quote }}
  PG_POOL_MAX: {{ .Values.server.pgPoolMax | quote }}
  CRON_ENABLED: {{ .Values.server.cron.enabled | quote }}
  RELAYAUTH_JWKS_URL: {{ .Values.relayauth.jwksUrl | quote }}
  RELAYAUTH_ISSUER: {{ .Values.relayauth.issuer | quote }}
  RELAYAUTH_AUDIENCE: {{ .Values.relayauth.historyOrigin | quote }}
  RELAYHISTORY_ORIGIN: {{ .Values.relayauth.historyOrigin | quote }}
  AGENT_RELAY_CLOUD_API_URL: {{ .Values.agentRelayCloud.apiUrl | quote }}
  SESSION_EVENTS_ENABLED: {{ .Values.sessionAnalysis.enabled | quote }}
  {{- if and .Values.telemetry.enabled .Values.telemetry.host }}
  POSTHOG_HOST: {{ .Values.telemetry.host | quote }}
  {{- end }}
  {{- range $key, $value := .Values.extraConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
