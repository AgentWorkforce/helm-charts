{{- include "relayhistory.validate" . }}
{{- if .Values.migrations.enabled }}
{{- $identity := printf "%s|%s|%s|%s|%v" (include "relayhistory.image" .) .Values.database.existingSecret .Values.database.keys.migrationsUrl .Values.migrations.identitySalt .Values.migrations.allowWriteHold | sha256sum | trunc 8 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate-%s" (include "relayhistory.fullname" . | trunc 45 | trimSuffix "-") $identity }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relayhistory.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "relayhistory.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "relayhistory.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "relayhistory.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [migrate.mjs]
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: DATABASE_MIGRATIONS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.keys.migrationsUrl | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.keys.url | quote }}
            {{- with .Values.database.runtimeRole }}
            - { name: DATABASE_RUNTIME_ROLE, value: {{ . | quote }} }
            {{- end }}
            - { name: ALLOW_WRITE_HOLD, value: {{ ternary "yes" "no" .Values.migrations.allowWriteHold | quote }} }
            - { name: ROLLOUT_BUDGET_SECONDS, value: {{ .Values.migrations.rolloutBudgetSeconds | quote }} }
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
{{- end }}
