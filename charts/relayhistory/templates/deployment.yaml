{{- include "relayhistory.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relayhistory.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "relayhistory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{ include "relayhistory.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
      labels:
        {{- include "relayhistory.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "relayhistory.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: history
          image: {{ include "relayhistory.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [server.mjs]
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - { name: http, containerPort: {{ .Values.server.port }}, protocol: TCP }
          # Later envFrom sources win on duplicate keys, so the chart ConfigMap
          # comes last: extraEnvFrom can add variables but cannot override the
          # managed configuration (explicit env entries win over both).
          envFrom:
            {{- with .Values.extraEnvFrom }}{{ toYaml . | nindent 12 }}{{- end }}
            - configMapRef: { name: {{ include "relayhistory.fullname" . }} }
          env:
            {{- include "relayhistory.secretEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          startupProbe: {{ toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe: {{ toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe: {{ toYaml .Values.readinessProbe | nindent 12 }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 8 }}
      {{- end }}
