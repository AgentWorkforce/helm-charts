{{- include "relayhistory.validate" . }}
{{- if and .Values.migrations.enabled .Values.migrations.drainForWriteHold }}
# Rendered only during step 1 of a write-hold upgrade (README.md): lets the
# migrate Job's init container list this release's History pods. The History
# Deployment itself never mounts a ServiceAccount token.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "relayhistory.fullname" . | trunc 52 | trimSuffix "-" }}-drain-wait
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "relayhistory.migrationLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "relayhistory.fullname" . | trunc 52 | trimSuffix "-" }}-drain-wait
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "relayhistory.migrationLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "relayhistory.fullname" . | trunc 52 | trimSuffix "-" }}-drain-wait
subjects:
  - kind: ServiceAccount
    name: {{ include "relayhistory.serviceAccountName" . }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
