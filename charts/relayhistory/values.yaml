# The GCP proof runs one replica and makes no HA claim.
replicaCount: 1
image:
  # The proof image is experimental and is not a released/supported artifact.
  repository: ghcr.io/agentworkforce/relayhistory
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

server:
  port: 8080
  environment: production
  maxBodyBytes: 104857600
  maxInflightBodyBytes: 0
  shutdownDrainDelaySeconds: 5
  pgPoolMax: 10
  cron: { enabled: true }

relayauth:
  historyOrigin: ""
  jwksUrl: ""
  issuer: ""
agentRelayCloud:
  apiUrl: ""

database:
  existingSecret: ""
  keys:
    url: DATABASE_URL
    migrationsUrl: DATABASE_MIGRATIONS_URL
  runtimeRole: ""

embeddings:
  enabled: false
  existingSecret: ""
  key: EMBEDDING_API_KEY
sessionAnalysis:
  enabled: false
  existingSecret: ""
  key: OPENAI_API_KEY
telemetry:
  enabled: false
  existingSecret: ""
  key: POSTHOG_API_KEY
  host: ""

migrations:
  enabled: true
  # The Job name carries a hash of the fully rendered pod template, so any
  # change to it (image, env, resources, security context...) creates a new
  # Job instead of patching the immutable spec.template. Change identitySalt
  # only to force a re-run with an otherwise identical template.
  identitySalt: ""
  allowWriteHold: false
  rolloutBudgetSeconds: 600
  backoffLimit: 1
  activeDeadlineSeconds: 3600

extraConfig: {}
extraEnv: []
# EnvFromSource entries. They are listed before the chart ConfigMap, so they
# cannot override chart-managed keys (RELAYAUTH_*, CRON_ENABLED, ...).
extraEnvFrom: []
service:
  type: ClusterIP
  port: 8080
  annotations: {}
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []
  externalTls: false

serviceAccount:
  create: true
  name: ""
  annotations: {}
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities: { drop: [ALL] }
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { memory: 1Gi }
startupProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 2
  failureThreshold: 30
livenessProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 10
  timeoutSeconds: 3
readinessProbe:
  httpGet: { path: /readyz, port: http }
  periodSeconds: 10
  timeoutSeconds: 3
networkPolicy:
  enabled: true
  # With allowAllEgress=false the pods may reach only same-namespace pods and
  # DNS plus additionalEgress. The database (and any service URL outside the
  # namespace) needs an additionalEgress rule, so rendering fails when
  # allowAllEgress=false and additionalEgress is empty. Give each rule a
  # non-empty `to` (enforced): an empty or omitted `to` matches every
  # destination; use ipBlock 0.0.0.0/0 to allow any destination explicitly.
  ingressFrom: []
  allowAllEgress: false
  additionalEgress: []
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
