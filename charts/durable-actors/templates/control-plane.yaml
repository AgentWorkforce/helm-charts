{{- include "actors.validate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "actors.name" . }}
  annotations:
    {{- /* Local patch 10: S3 deployments may omit the GKE Workload Identity annotation. */}}
    {{- if or (eq .Values.storage.provider "gcs") .Values.serviceAccount.googleServiceAccount }}
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.googleServiceAccount | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- $workloads := list (dict "name" (include "actors.name" .) "role" "control_plane" "replicas" .Values.replicaCount) (dict "name" (include "actors.poolManagerName" .) "role" "pool_manager" "replicas" 1) }}
{{- range $workload := $workloads }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $workload.name }}
spec:
  replicas: {{ $workload.replicas }}
  {{- if eq $workload.role "pool_manager" }}
  # Exactly one pool manager: the old pod stops before its replacement starts.
  strategy: {type: Recreate}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $workload.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $workload.name }}
    spec:
      serviceAccountName: {{ include "actors.name" $ }}
      terminationGracePeriodSeconds: 60
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: sandbox.gke.io/runtime
                    operator: NotIn
                    values: [gvisor]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: control-plane
          image: {{ include "actors.image" $.Values.images.controlPlane | quote }}
          ports:
            - {name: http, containerPort: 7100}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          {{- if eq $workload.role "control_plane" }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
          {{- end }}
          # The pool manager reports unhealthy once its housekeeping loop stops completing passes.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          env:
            - {name: DURABLE_ACTORS_PROCESS_ROLE, value: {{ $workload.role }}}
            - {name: DURABLE_ACTORS_CONTROL_PLANE_BIND, value: "0.0.0.0:7100"}
            - {name: DURABLE_ACTORS_ALARM_POLL_INTERVAL_MS, value: {{ $.Values.alarms.pollIntervalMs | quote }}}
            - {name: DURABLE_ACTORS_POSTGRES_MAX_CONNECTIONS, value: {{ $.Values.postgres.maxConnections | quote }}}
            - {name: DURABLE_ACTORS_ANALYTICS_BACKEND, value: {{ $.Values.analytics.backend | quote }}}
            {{- with $.Values.usage.topic }}
            - {name: DURABLE_ACTORS_USAGE_TOPIC, value: {{ . | quote }}}
            {{- end }}
            {{- if eq $.Values.analytics.backend "clickhouse" }}
            - {name: DURABLE_ACTORS_CLICKHOUSE_URL, value: {{ $.Values.analytics.clickhouse.url | quote }}}
            - {name: DURABLE_ACTORS_CLICKHOUSE_DATABASE, value: {{ $.Values.analytics.clickhouse.database | quote }}}
            - {name: DURABLE_ACTORS_CLICKHOUSE_USER, value: {{ $.Values.analytics.clickhouse.user | quote }}}
            - name: DURABLE_ACTORS_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $.Values.credentialsSecret | quote }}, key: {{ $.Values.analytics.clickhouse.passwordSecretKey | quote }}}
            {{- end }}
            - {name: DURABLE_ACTORS_ORGANIZATION_LIMITS_ENABLED, value: {{ $.Values.organizationLimits.enabled | quote }}}
            - {name: DURABLE_ACTORS_ORGANIZATION_MAX_ACTIVE_ACTORS, value: {{ $.Values.organizationLimits.maxActiveActors | quote }}}
            - {name: DURABLE_ACTORS_ORGANIZATION_ACTOR_STARTS_PER_SECOND, value: {{ $.Values.organizationLimits.actorStartsPerSecond | quote }}}
            - {name: DURABLE_ACTORS_ORGANIZATION_ACTOR_START_BURST, value: {{ $.Values.organizationLimits.actorStartBurst | quote }}}
            - name: DURABLE_ACTORS_CONTROL_PLANE_URL
              value: {{ printf "http://%s.%s.svc.cluster.local:7100" (include "actors.name" $) $.Release.Namespace | quote }}
            - {name: DURABLE_ACTORS_PUBLIC_URL, value: {{ $.Values.publicUrl | quote }}}
            - {name: DURABLE_ACTORS_TYPESCRIPT_IMAGE, value: {{ include "actors.image" $.Values.images.typescript | quote }}}
            - {name: DURABLE_ACTORS_PYTHON_IMAGE, value: {{ include "actors.image" $.Values.images.python | quote }}}
            - {name: DURABLE_ACTORS_GKE_NAMESPACE, value: {{ include "actors.sandboxNamespace" $ | quote }}}
            - {name: DURABLE_ACTORS_GKE_ZONE, value: {{ $.Values.placement.zone | quote }}}
            {{- if eq $.Values.storage.provider "s3" }}
            - {name: DURABLE_ACTORS_STORAGE_PROVIDER, value: s3}
            - {name: DURABLE_ACTORS_S3_REGION, value: {{ $.Values.storage.s3.region | quote }}}
            {{- if eq $.Values.storage.s3.actorCredentials "control-plane" }}
            # Weaker isolation: actor hosts share the control plane's S3 credentials (per bucket prefix, not per actor).
            - {name: DURABLE_ACTORS_S3_ACTOR_CREDENTIALS, value: control-plane}
            {{- else }}
            - {name: DURABLE_ACTORS_S3_ACTOR_ROLE_ARN, value: {{ $.Values.storage.s3.actorRoleArn | quote }}}
            {{- end }}
            {{- with $.Values.storage.s3.endpoint }}
            - {name: DURABLE_ACTORS_S3_ENDPOINT, value: {{ . | quote }}}
            - {name: DURABLE_ACTORS_S3_FORCE_PATH_STYLE, value: {{ $.Values.storage.s3.forcePathStyle | quote }}}
            {{- end }}
            {{- end }}
            {{- with $.Values.sandbox }}
            {{- if not (kindIs "invalid" .runtimeClassName) }}
            - {name: DURABLE_ACTORS_SANDBOX_RUNTIME_CLASS, value: {{ .runtimeClassName | quote }}}
            {{- end }}
            {{- if not (kindIs "invalid" .nodeSelector) }}
            - {name: DURABLE_ACTORS_SANDBOX_NODE_SELECTOR, value: {{ .nodeSelector | toJson | quote }}}
            {{- end }}
            {{- if not (kindIs "invalid" .tolerations) }}
            - {name: DURABLE_ACTORS_SANDBOX_TOLERATIONS, value: {{ .tolerations | toJson | quote }}}
            {{- end }}
            {{- end }}
            - {name: DURABLE_ACTORS_PERSISTENCE, value: {{ $.Values.storage.mode | quote }}}
            - {name: DURABLE_ACTORS_BUCKET, value: {{ $.Values.storage.bucket | quote }}}
            - {name: DURABLE_ACTORS_ARTIFACT_BUCKET, value: {{ $.Values.storage.bucket | quote }}}
            {{- if eq $.Values.storage.mode "rapid" }}
            - {name: DURABLE_ACTORS_ARCHIVE_BUCKET, value: {{ $.Values.storage.bucket | quote }}}
            - {name: DURABLE_ACTORS_RAPID_BUCKETS, value: {{ $.Values.storage.rapid.buckets | toJson | quote }}}
            - {name: DURABLE_ACTORS_RAPID_PLACEMENT, value: {{ $.Values.storage.rapid.placement | quote }}}
            {{- end }}
            - {name: DURABLE_ACTORS_SPARE_IDLE, value: {{ $.Values.actors.warm | quote }}}
            {{- with $.Values.actors.hostIdleTimeoutMs }}
            - {name: DURABLE_ACTORS_HOST_IDLE_TIMEOUT_MS, value: {{ . | quote }}}
            {{- end }}
            - {name: DURABLE_ACTORS_SPARE_MAX_STARTING, value: {{ $.Values.actors.maxStarting | quote }}}
            - {name: DURABLE_ACTORS_SPARE_REFILL_INTERVAL_MS, value: {{ $.Values.actors.refillIntervalMs | quote }}}
            - {name: DURABLE_ACTORS_SPARE_RETIRE_CONCURRENCY, value: {{ $.Values.actors.retireConcurrency | quote }}}
            - {name: DURABLE_ACTORS_SPARE_REAP_INTERVAL_MS, value: {{ $.Values.actors.registryReapIntervalMs | quote }}}
            - {name: DURABLE_ACTORS_SPARE_POD_REAP_INTERVAL_MS, value: {{ $.Values.actors.podReapIntervalMs | quote }}}
            - {name: DURABLE_ACTORS_GKE_REAP_CONCURRENCY, value: {{ $.Values.actors.reapConcurrency | quote }}}
            - {name: DURABLE_ACTORS_HOST_CPU_MILLIS, value: {{ $.Values.actors.cpuMillis | quote }}}
            {{- with $.Values.actors.cpuLimitMillis }}
            - {name: DURABLE_ACTORS_HOST_CPU_LIMIT_MILLIS, value: {{ . | quote }}}
            {{- end }}
            - {name: DURABLE_ACTORS_HOST_MEMORY_MIB, value: {{ $.Values.actors.memoryMiB | quote }}}
            {{- with $.Values.actors.memoryLimitMiB }}
            - {name: DURABLE_ACTORS_HOST_MEMORY_LIMIT_MIB, value: {{ . | quote }}}
            {{- end }}
            {{- if not (kindIs "invalid" $.Values.actors.bounds.minCpuMillis) }}
            - {name: DURABLE_ACTORS_SANDBOX_MIN_CPU_MILLIS, value: {{ $.Values.actors.bounds.minCpuMillis | quote }}}
            {{- end }}
            {{- if not (kindIs "invalid" $.Values.actors.bounds.maxCpuMillis) }}
            - {name: DURABLE_ACTORS_SANDBOX_MAX_CPU_MILLIS, value: {{ $.Values.actors.bounds.maxCpuMillis | quote }}}
            {{- end }}
            {{- if not (kindIs "invalid" $.Values.actors.bounds.minMemoryMiB) }}
            - {name: DURABLE_ACTORS_SANDBOX_MIN_MEMORY_MIB, value: {{ $.Values.actors.bounds.minMemoryMiB | quote }}}
            {{- end }}
            {{- if not (kindIs "invalid" $.Values.actors.bounds.maxMemoryMiB) }}
            - {name: DURABLE_ACTORS_SANDBOX_MAX_MEMORY_MIB, value: {{ $.Values.actors.bounds.maxMemoryMiB | quote }}}
            {{- end }}
            - name: DURABLE_ACTORS_POSTGRES_URL
              valueFrom:
                secretKeyRef: {name: {{ $.Values.credentialsSecret | quote }}, key: postgres-url}
            - name: DURABLE_ACTORS_JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: {{ $.Values.credentialsSecret | quote }}, key: jwt-signing-key}
            - name: DURABLE_ACTORS_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $.Values.credentialsSecret | quote }}, key: api-key}
            {{- with $.Values.invokeApiKeySecretKey }}
            - name: DURABLE_ACTORS_INVOKE_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ $.Values.credentialsSecret | quote }}, key: {{ . | quote }}}
            {{- end }}
            {{- with $.Values.redis.urlSecretKey }}
            - name: DURABLE_ACTORS_REDIS_URL
              valueFrom:
                secretKeyRef: {name: {{ $.Values.credentialsSecret | quote }}, key: {{ . | quote }}}
            {{- end }}
            {{- with $.Values.redis.caSecretKey }}
            - name: DURABLE_ACTORS_REDIS_CA_CERT
              valueFrom:
                secretKeyRef: {name: {{ $.Values.credentialsSecret | quote }}, key: {{ . | quote }}}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "actors.name" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "actors.name" . }}
  ports:
    - {name: http, port: 7100, targetPort: http}
{{- if gt (int .Values.replicaCount) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "actors.name" . }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "actors.name" . }}
{{- end }}
