{{- if .Values.externalSecrets.enabled }}
{{- if not .Values.externalSecrets.secretStoreRef.name }}{{ fail "alleyoop: externalSecrets.secretStoreRef.name is required when externalSecrets.enabled" }}{{ end }}
{{- $required := list .Values.secretKeys.hoopdbUrl .Values.secretKeys.lockerAccessKeyId .Values.secretKeys.lockerSecretAccessKey }}
{{- if .Values.auth.localJwks }}{{ $required = append $required .Values.secretKeys.jwksJson }}{{ end }}
{{- range $required }}{{ if not (hasKey $.Values.externalSecrets.data .) }}{{ fail (printf "alleyoop: externalSecrets.data must map %s" .) }}{{ end }}{{ end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "alleyoop.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "alleyoop.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: {{ .Values.externalSecrets.creationPolicy }}
  data:
    {{- range $k, $ref := .Values.externalSecrets.data }}
    - secretKey: {{ $k }}
      remoteRef:
        {{- toYaml $ref | nindent 8 }}
    {{- end }}
{{- end }}
