apiVersion: v1
kind: Service
metadata:
  name: {{ include "alleyoop.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "alleyoop.componentLabels" (dict "context" . "component" "alleyoop-ingest") | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "alleyoop.componentSelectorLabels" (dict "context" . "component" "alleyoop-ingest") | nindent 4 }}
