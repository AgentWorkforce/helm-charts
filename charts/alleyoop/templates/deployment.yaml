{{- include "alleyoop.validate" . -}}
{{- $component := "alleyoop-ingest" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alleyoop.componentName" (dict "context" . "component" "ingest") }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "alleyoop.componentLabels" (dict "context" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.ingest.replicas }}
  selector:
    matchLabels:
      {{- include "alleyoop.componentSelectorLabels" (dict "context" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alleyoop.componentSelectorLabels" (dict "context" . "component" $component) | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- include "alleyoop.podSpecCommon" . | nindent 6 }}
      containers:
        - name: ingest
          image: {{ include "alleyoop.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ingest.port }}
              protocol: TCP
          env:
            {{- include "alleyoop.env" (dict "context" . "service" $component) | nindent 12 }}
            - name: INGEST_PORT
              value: {{ .Values.ingest.port | quote }}
            - name: AUTH_ISSUER
              value: {{ .Values.auth.issuer | quote }}
            - name: AUTH_AUDIENCE
              value: {{ .Values.auth.audience | quote }}
            {{- if .Values.auth.jwksUrl }}
            - name: RELAYAUTH_JWKS_URL
              value: {{ .Values.auth.jwksUrl | quote }}
            {{- else if .Values.auth.localJwks }}
            - name: JWKS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.jwksJson }}
            {{- end }}
            {{- with .Values.ingest.env }}
            {{- include "alleyoop.renderEnv" . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ingest.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
