## Default values for alleyoop (96Bulls ingest).
## Secrets are NEVER set here: point existingSecret at a Secret you create.

global:
  # Registry prefixed to relative image.repository values. The default image
  # repository is private and requires imagePullSecrets outside hosted EKS.
  imageRegistry: ghcr.io
  otel:
    # OTLP/HTTP endpoint; rendered as OTEL_EXPORTER_OTLP_ENDPOINT. Empty = unset.
    endpoint: ""

# One image for every component; SERVICE= selects the entry point.
image:
  repository: agentworkforce/96bulls-services
  # Defaults to Chart.appVersion when empty.
  tag: ""
  # sha256 digest; when set it wins over tag. Default: the services image
  # built from 96BullSessions main 7d7229b (#124 + #125 + #139 + #137; GHCR publish-image run
  # 41375745173; migration generation eff8b3be...259b). This hosted
  # service package is private: add imagePullSecrets for direct installs.
  # When overriding repository or tag, clear digest or set a matching digest.
  digest: "sha256:6f22ea17dff336e1431664542759fd27958649388b90a0b2f0881883caa7c6b2"
  pullPolicy: IfNotPresent

# Optional; passed to every workload and Job.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Secret containing Locker credentials in secret mode and, unless
# hoopdb.existingSecret is set, HOOPDB_URL. May be empty in podIdentity mode
# when HoopDb uses its own Secret and auth.localJwks is false.
existingSecret: ""
secretKeys:
  hoopdbUrl: HOOPDB_URL
  lockerAccessKeyId: LOCKER_ACCESS_KEY_ID
  lockerSecretAccessKey: LOCKER_SECRET_ACCESS_KEY
  # Used only when auth.localJwks=true (local/kind).
  jwksJson: JWKS_JSON

# OPTIONAL: read HOOPDB_URL from a different Secret than existingSecret, e.g.
# the "<cluster>-app" Secret CloudNativePG generates (key "uri"). Empty =
# existingSecret / secretKeys.hoopdbUrl.
hoopdb:
  existingSecret: ""
  key: ""

# Non-secret environment shared by every component (names are the services'
# env contract; do not rename).
locker:
  # s3 (default): S3-compatible store (MinIO, AWS S3). gcs: native Google Cloud
  # Storage through GKE Workload Identity; renders LOCKER_PROVIDER=gcs and
  # PIPELINE_RAW_PROVIDER=gcs and requires credentials.mode=podIdentity and an
  # empty (or https://storage.googleapis.com) endpoint. The services refuse
  # HMAC keys on GCS and the S3 client against storage.googleapis.com, so
  # "GCS as S3 with HMAC keys" is not supported. gcs also arms the services'
  # GCS data-path readiness check: extraEnv must carry
  # CLOUD_SQL_CONNECTION_NAME, REDIS_HOST, REDIS_PORT, REDIS_AUTH_ENABLED
  # ("false"), REDIS_TRANSIT_ENCRYPTION ("SERVER_AUTHENTICATION"),
  # REDIS_TLS_CA_PEM, PUBSUB_TOPIC and PUBSUB_SUBSCRIPTION.
  provider: s3
  # Required in secret mode, e.g. http://minio:9000. In podIdentity mode,
  # leave empty to use the provider's native endpoint (S3: for locker.region).
  endpoint: ""
  bucket: locker
  region: us-east-1
  credentials:
    # secret reads LOCKER_* keys from existingSecret; podIdentity omits both
    # static credential environment variables so the AWS SDK can use its
    # workload identity credential chain.
    mode: secret
tenant:
  orgId: ""           # REQUIRED
  workspaceId: default
deployment:
  name: selfhost      # DEPLOYMENT
  id: ""              # DEPLOYMENT_ID; defaults to the release namespace/name
environment: production
# Extra env for every component: [{ name: X, value: y }].
extraEnv: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
automountServiceAccountToken: false

# Auth for couriers. Hosted and customer installs point jwksUrl at RelayAuth.
# For kind/local only, set localJwks=true and put a JWKS document in
# existingSecret under secretKeys.jwksJson. Exactly one of the two is required.
auth:
  jwksUrl: ""
  localJwks: false
  # Must be RelayAuth's issuer when jwksUrl points at RelayAuth.
  issuer: https://96bulls.local
  audience: relayhistory
  # Optional RelayHistory origin (RELAYHISTORY_ORIGIN): the bare origin the
  # ingest expects as the History assertion audience. It must be byte-equal
  # to the courier's RELAYAUTH_HISTORY_ORIGIN. Empty = not rendered.
  historyOrigin: ""

# ALLOW_IN_CLUSTER_HTTP. false (default): the validated destination URLs
# (RelayAuth, Cloud, ingest, JWKS, history origin) must be https (or
# loopback). true allows plain http only to in-cluster Service FQDNs
# (<svc>.<ns>.svc or <svc>.<ns>.svc.cluster.local), never public hosts, IPs
# or short names; e.g. auth.jwksUrl=http://relayauth.relayauth.svc:8787/.well-known/jwks.json.
# LOCKER_ENDPOINT (the bundled MinIO's http://locker:9000) and the OTLP
# endpoint are outside this policy (96BullSessions README, runtime
# destinations), so the bundled Locker works with false.
allowInClusterHttp: false

ingest:
  replicas: 1
  port: 8080
  env: []
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

service:
  type: ClusterIP
  port: 8080
  annotations: {}

startupProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 2
  failureThreshold: 60
livenessProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 20
  timeoutSeconds: 3
# 503 until HoopDb answers and sessions.__96bulls_migrations matches the image.
readinessProbe:
  httpGet: { path: /readyz, port: http }
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}

# OPTIONAL: External Secrets Operator (e.g. a 1Password ClusterSecretStore).
# Off by default; customers create existingSecret themselves. When enabled the
# chart renders an ExternalSecret (named after the release) whose target IS
# existingSecret, so workloads are unchanged. Every key in secretKeys must be
# mapped in data. Remote key names only, never secret values.
externalSecrets:
  enabled: false
  refreshInterval: 1h
  # Owner: this release owns the target Secret. When 96bulls-worker and
  # alleyoop share one existingSecret, enable ESO in both only if the second
  # uses Merge (or enable it in just one release).
  creationPolicy: Owner
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  # Secret key -> remote reference, e.g.
  # HOOPDB_URL: { key: 96bulls-hoopdb, property: url }
  data: {}
