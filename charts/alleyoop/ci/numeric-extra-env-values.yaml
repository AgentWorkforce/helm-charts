existingSecret: 96bulls
locker:
  endpoint: http://locker:9000
tenant:
  orgId: org_ci
auth:
  jwksUrl: https://relayauth.example.com/.well-known/jwks.json
extraEnv:
  - name: REDIS_PORT
    # Intentionally numeric: the chart must coerce EnvVar values to strings.
    value: 6378
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: redis
        key: password
  - name: OPTIONAL_FLAG
    value: null
ingest:
  env:
    - name: INGEST_RETRY_LIMIT
      value: 6379
