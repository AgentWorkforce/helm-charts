{{- if .Values.networkPolicy.enabled -}}
{{- $ingressFrom := .Values.networkPolicy.ingressFrom | default list -}}
{{- if and $ingressFrom .Values.networkPolicy.allowExternalTraffic }}
{{- fail "networkPolicy.ingressFrom requires networkPolicy.allowExternalTraffic=false (allowExternalTraffic admits every source)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "relayfile.server.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relayfile.server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "relayfile.server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- if $ingressFrom }}
      from:
        {{- toYaml $ingressFrom | nindent 8 }}
      {{- else if not .Values.networkPolicy.allowExternalTraffic }}
      from:
        - podSelector: {}
      {{- end }}
{{- end }}
