apiVersion: v2
name: relayfile
type: application
version: 0.1.1
# appVersion tracks the default image tag. Pin image.tag in your values to a
# specific digest for reproducible deployments; do not rely on "latest".
appVersion: "0.1.0"
description: >
  Relayfile — virtual filesystem sync for agents. A single Go binary that
  serves a workspace file-sync API over HTTP, backed by Postgres in
  production or in-memory for development.
home: https://github.com/AgentWorkforce/relayfile
keywords:
  - relayfile
  - vfs
  - filesystem
  - sync
  - agents
  - agentworkforce
maintainers:
  - name: AgentWorkforce
    url: https://github.com/AgentWorkforce/helm-charts
sources:
  - https://github.com/AgentWorkforce/helm-charts/tree/main/charts/relayfile
