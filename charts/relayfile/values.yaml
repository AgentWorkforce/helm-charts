## Default values for relayfile.
## This is a YAML-formatted file. Declare variables to be passed into your templates.

# ---------------------------------------------------------------------------
# Runtime backend
# ---------------------------------------------------------------------------
# go:           the Go server (image.*, server.*, secrets.*); state in Postgres.
# durable-actors: Relayfile on TerseAI durable-actors. A stateless gateway
#               Deployment (named and selected like the Go server, so the
#               Service, Ingress, HPA, PDB and NetworkPolicy are shared) routes
#               each workspace to its own `Workspace` actor; file bytes go to
#               object storage. See docs/self-hosted-durable-actors.md.
runtime:
  backend: go
  durableActors:
    # Gateway image, two commands: gateway | session-broker
    # (relayfile repo, docker/actors.Dockerfile).
    image:
      repository: ghcr.io/agentworkforce/relayfile-actors
      # Pin a digest (sha256:<64 hex>) or, for local proofs only, a tag.
      digest: ""
      tag: ""
      pullPolicy: IfNotPresent
    # Workspace actor image: the actor project plus the durable-actors SDK
    # compiler (relayfile repo, docker/actors-workspace.Dockerfile). Runs
    # `deploy` in the deploy Job and `dev` in the devRuntime sidecar.
    workspaceImage:
      repository: ghcr.io/agentworkforce/relayfile-actors-workspace
      digest: ""
      tag: ""
      pullPolicy: IfNotPresent
    # durable-actors project that holds the Workspace actors.
    projectId: relayfile
    # durable-actors organization the deployment is registered under.
    organizationId: relayfile
    # Control-plane origin. Empty: the umbrella's durable-actors release,
    # http://<release>-durable-actors.<namespace>.svc.cluster.local:7100.
    controlPlaneUrl: ""
    # REQUIRED: an existing Secret in the release namespace (keys below).
    existingSecret: ""
    secretKeys:
      # HS256 workspace-token secret. Optional when auth.jwksUrl is set.
      jwtSecret: RELAYFILE_JWT_SECRET
      # Shared secret between the gateway and the session broker.
      brokerToken: RELAYFILE_ACTORS_BROKER_TOKEN
      # Optional: enables /v1/internal/webhook-envelopes. Empty disables it.
      internalHmacSecret: ""
    # The durable-actors administrative api-key (the durable-actors chart's
    # credentialsSecret, key api-key). Only the session broker and the deploy
    # Job read it; the internet-facing gateway never does.
    adminKeySecret:
      name: actors-credentials
      key: api-key
    gateway:
      # Stateless: any count >= 1 (autoscaling.* also applies).
      replicaCount: 2
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 512Mi }
    broker:
      replicaCount: 1
      port: 8090
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { memory: 256Mi }
    # Registers the compiled Workspace actor bundle with the control plane.
    # A plain Job (no Helm hook) whose name changes with its pod template, so
    # a new image or setting runs it once more.
    deployer:
      enabled: true
      # The durable-actors storage.bucket: compiled code is uploaded under
      # durable-actors/v3/artifacts/<uuid>/. Required when enabled.
      artifactBucket: ""
      backoffLimit: 3
      serviceAccount:
        # Workload Identity: a GSA with roles/storage.objectUser on the bucket.
        annotations: {}
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 1Gi }
    # Where the gateway keeps file bytes. Actors only hold metadata and refs.
    blobStore:
      # gcs (Workload Identity via serviceAccount.annotations) | s3 (MinIO,
      # AWS, R2, GCS-HMAC) | inline (bytes in actor SQLite; devRuntime only).
      driver: gcs
      bucket: ""
      prefix: relayfile/
      # Content at or below this many bytes stays inline in the actor.
      inlineMaxBytes: 65536
      s3:
        endpoint: ""
        region: us-east-1
        forcePathStyle: false
        # Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Empty: the
        # pod's ambient identity (IRSA, Pod Identity).
        existingSecret: ""
    # kind/CI only: run `durable-actors dev` as a sidecar in the gateway pod
    # (single process, local storage, no GKE Sandbox, no GCS). Forces one
    # replica, no broker and no deploy Job; the gateway then holds the dev
    # runtime's key. Never for production.
    devRuntime:
      enabled: false
      acknowledgeNonProduction: false
      # Image: runtime.durableActors.workspaceImage (command `dev`).
      port: 7100
      # Key in runtime.durableActors.existingSecret holding the dev runtime's
      # DURABLE_ACTORS_SECRET (shared by the sidecar and the gateway).
      secretKey: DURABLE_ACTORS_SECRET
      # Empty: emptyDir (actor state is lost with the pod).
      existingClaim: ""
      resources:
        requests: { cpu: 200m, memory: 512Mi }
        limits: { memory: 2Gi }

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
image:
  # Registry + repository for the relayfile server image.
  repository: ghcr.io/agentworkforce/relayfile
  # Overrides the image tag (defaults to Chart.appVersion when empty).
  tag: ""
  pullPolicy: IfNotPresent

# Image pull secrets for private registries.
imagePullSecrets: []

# ---------------------------------------------------------------------------
# Replica count
# ---------------------------------------------------------------------------
replicaCount: 1

# ---------------------------------------------------------------------------
# Server configuration
# ---------------------------------------------------------------------------
server:
  # Port the server listens on. Used for the container port, Service port, and to
  # derive RELAYFILE_ADDR. Must match the port component of server.addr when both are set.
  port: 8080

  # Full TCP address the server listens on (RELAYFILE_ADDR). Defaults to ":{{ server.port }}"
  # when empty, which binds all interfaces on server.port.
  # WARNING: binding to a loopback/host-specific address (e.g. "127.0.0.1:9090") makes the
  # server unreachable from the cluster — kubelet probes and the Kubernetes Service target
  # the pod IP, not loopback. Keep this empty unless you know what you're doing.
  addr: ""

  # Storage backend profile (RELAYFILE_BACKEND_PROFILE).
  # "production" — Postgres (RELAYFILE_PRODUCTION_DSN required)
  # "memory"     — in-process; dev/test only, state lost on restart
  # "durable-local" — file-backed; requires containerSecurityContext.readOnlyRootFilesystem=false
  #                   and a writable volume at RELAYFILE_DATA_DIR; not recommended for production
  # "custom"     — bring your own DSNs via RELAYFILE_STATE_BACKEND_DSN etc.
  backendProfile: "production"

  # Number of in-process envelope-processing workers (RELAYFILE_ENVELOPE_WORKERS).
  envelopeWorkers: 2

  # Number of in-process writeback workers (RELAYFILE_WRITEBACK_WORKERS).
  writebackWorkers: 2

  # Maximum concurrent provider operations (RELAYFILE_PROVIDER_MAX_CONCURRENCY).
  providerMaxConcurrency: 4

  # Optional: maximum rate limit requests per window (RELAYFILE_RATE_LIMIT_MAX).
  rateLimitMax: ""

  # Optional: rate limit window duration, e.g. "1m" (RELAYFILE_RATE_LIMIT_WINDOW).
  rateLimitWindow: ""

  # Optional: max request body size in bytes (RELAYFILE_MAX_BODY_BYTES).
  maxBodyBytes: ""

# ---------------------------------------------------------------------------
# Secrets / credentials
# ---------------------------------------------------------------------------
secrets:
  # If set, use this existing Kubernetes Secret instead of creating one.
  # The secret must contain keys: RELAYFILE_PRODUCTION_DSN, RELAYFILE_INTERNAL_HMAC_SECRET,
  # RELAYFILE_JWT_SECRET (plus any provider tokens you use).
  existingSecret: ""

  # Used only when existingSecret is empty (chart creates a Secret).
  # REQUIRED in production when backendProfile=production.
  productionDsn: ""          # RELAYFILE_PRODUCTION_DSN — Postgres connection string

  # REQUIRED: HMAC secret for the internal webhook endpoint.
  internalHmacSecret: ""     # RELAYFILE_INTERNAL_HMAC_SECRET

  # JWT secret used to mint/verify workspace tokens.
  jwtSecret: ""              # RELAYFILE_JWT_SECRET

# ---------------------------------------------------------------------------
# External authentication (relayauth)
# ---------------------------------------------------------------------------
auth:
  # JWKS URL served by the relayauth service (RELAYAUTH_JWKS_URL).
  # relayauth is a separate external service; only its public JWKS endpoint is needed here.
  jwksUrl: ""

# ---------------------------------------------------------------------------
# Provider credentials (optional — configure only the providers you use)
# ---------------------------------------------------------------------------
providers:
  notion:
    # Personal integration token (RELAYFILE_NOTION_TOKEN).
    token: ""
    # Override Notion API base URL (RELAYFILE_NOTION_BASE_URL) — leave empty for default.
    baseUrl: ""
    # Notion API version header (RELAYFILE_NOTION_API_VERSION) — leave empty for default.
    apiVersion: ""

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080
  annotations: {}

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  # Ingress class name (e.g. "nginx", "traefik").
  className: ""
  annotations: {}
  # hosts:
  #   - host: relayfile.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  hosts: []
  tls: []

# ---------------------------------------------------------------------------
# Resource requests and limits
# ---------------------------------------------------------------------------
# Default requests ensure HPA CPU/memory utilization metrics are computable.
# Override or remove in environments with a LimitRange that supplies defaults.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  # limits:
  #   cpu: 500m
  #   memory: 512Mi

# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# ---------------------------------------------------------------------------
# Vertical Pod Autoscaler
# ---------------------------------------------------------------------------
verticalPodAutoscaler:
  enabled: false
  # "Off" — recommendations only, no active pod mutations (safe default).
  # "Auto" — actively mutates resource requests; can restart pods and conflict with HPA.
  updateMode: "Off"

# ---------------------------------------------------------------------------
# Pod Disruption Budget
# ---------------------------------------------------------------------------
podDisruptionBudget:
  enabled: false
  # Exactly one of minAvailable or maxUnavailable must be set when enabled=true.
  # Kubernetes rejects a PDB with neither field, and also rejects one with both.
  # Uncomment exactly one:
  # minAvailable: 1
  # maxUnavailable: 1

# ---------------------------------------------------------------------------
# Network Policy
# ---------------------------------------------------------------------------
networkPolicy:
  # Enable a NetworkPolicy that restricts ingress to the server port only.
  enabled: false
  # Allow ingress from all namespaces when true.
  allowExternalTraffic: true

# ---------------------------------------------------------------------------
# Service Account
# ---------------------------------------------------------------------------
serviceAccount:
  # Create a dedicated ServiceAccount for the server pod.
  create: true
  # Annotations to add (e.g. for IRSA / Workload Identity).
  annotations: {}
  # Override the auto-generated name.
  name: ""

# ---------------------------------------------------------------------------
# Pod configuration
# ---------------------------------------------------------------------------
podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# Scheduling
# ---------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Health probes
# ---------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# ---------------------------------------------------------------------------
# Extra environment variables and envFrom sources
# ---------------------------------------------------------------------------
# Inject arbitrary env vars (e.g. for additional providers not listed above).
# Example:
#   extraEnv:
#     - name: RELAYFILE_GITHUB_TOKEN
#       valueFrom:
#         secretKeyRef:
#           name: my-secret
#           key: github-token
extraEnv: []

# Mount existing ConfigMaps or Secrets as environment variable sources.
extraEnvFrom: []

# ---------------------------------------------------------------------------
# Name overrides
# ---------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""
