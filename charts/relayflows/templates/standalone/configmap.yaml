{{- if and (eq (include "relayflows.mode" .) "standalone") .Values.standalone.flow.content -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "relayflows.flowConfigMapName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relayflows.labels" . | nindent 4 }}
data:
  {{ required "standalone.flow.configMapKey must not be empty" .Values.standalone.flow.configMapKey | quote }}: |-
    {{- .Values.standalone.flow.content | nindent 4 }}
{{- end }}
