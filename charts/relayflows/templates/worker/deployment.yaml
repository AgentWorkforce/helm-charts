apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relayflows.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relayflows.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One Cloud worker identity must never be consumed concurrently. Recreate also
  # avoids ReadWriteOnce multi-attach races during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "relayflows.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations (not .Values.credentials.existingSecret) }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if not .Values.credentials.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "relayflows.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "relayflows.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.runtimeInstaller.enabled .Values.extraInitContainers }}
      initContainers:
        {{- if .Values.runtimeInstaller.enabled }}
        - name: install-runtime
          image: {{ include "relayflows.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - >-
              npm install --global --prefix /opt/relayflows-runtime
              --ignore-scripts --no-audit --no-fund
              "agent-relay@${AGENT_RELAY_VERSION}"
              "relayflows@${RELAYFLOWS_VERSION}"
          env:
            - name: AGENT_RELAY_VERSION
              value: {{ .Values.runtimeInstaller.agentRelayVersion | quote }}
            - name: RELAYFLOWS_VERSION
              value: {{ .Values.runtimeInstaller.relayflowsVersion | quote }}
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp/npm-cache
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.runtimeInstaller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: runtime
              mountPath: /opt/relayflows-runtime
            - name: tmp
              mountPath: /tmp
        {{- end }}
        {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "relayflows.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.worker.command }}
          command:
            {{- toYaml .Values.worker.command | nindent 12 }}
          {{- else }}
          command:
            - /bin/sh
            - -ec
          {{- end }}
          {{- if .Values.worker.args }}
          args:
            {{- toYaml .Values.worker.args | nindent 12 }}
          {{- else if not .Values.worker.command }}
          args:
            - |-
              {{- include "relayflows.workerScript" . | nindent 14 }}
          {{- end }}
          env:
            - name: HOME
              value: /var/lib/agent-relay/home
            - name: AGENT_RELAY_HOME
              value: /var/lib/agent-relay
            - name: AGENT_RELAY_CLOUD_URL
              value: {{ .Values.worker.cloudUrl | quote }}
            - name: AGENT_RELAY_WORKER_NAME
              value: {{ include "relayflows.workerName" . | quote }}
            - name: AGENT_RELAY_WORKER_ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "relayflows.secretName" . }}
                  key: {{ .Values.credentials.existingSecretKey | quote }}
                  # Registration state is durable, but enrollment tokens are
                  # one-time. Permit the spent Secret to be removed after the
                  # first successful registration.
                  optional: true
            {{- if not .Values.telemetry.enabled }}
            - name: AGENT_RELAY_TELEMETRY_DISABLED
              value: "1"
            {{- end }}
            {{- if .Values.runtimeInstaller.enabled }}
            - name: PATH
              value: /opt/relayflows-runtime/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/agent-relay
            - name: runtime
              mountPath: /opt/relayflows-runtime
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "relayflows.pvcName" . }}
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
