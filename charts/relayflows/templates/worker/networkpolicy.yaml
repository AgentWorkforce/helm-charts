{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "relayflows.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relayflows.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "relayflows.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # DNS remains available when callers replace the default HTTPS rule.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.networkPolicy.egress }}
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
    {{- else }}
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
{{- end }}
