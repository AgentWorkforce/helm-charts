{{- if not .Values.credentials.existingSecret -}}
{{- if not .Values.credentials.enrollmentToken -}}
{{- fail "credentials.enrollmentToken is required (or set credentials.existingSecret to a Secret containing the enrollment token)" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "relayflows.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relayflows.labels" . | nindent 4 }}
type: Opaque
stringData:
  AGENT_RELAY_WORKER_ENROLLMENT_TOKEN: {{ .Values.credentials.enrollmentToken | quote }}
{{- end }}
