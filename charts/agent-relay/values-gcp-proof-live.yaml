# Existing proof-cluster overlay. Apply after values-gcp-proof.yaml.
# RelayAuth and the Sessions pipeline already run in their own namespaces.
# The exposed components inherit the proof profile's GKE load-balancer
# NetworkPolicy rules.
#
# Cross-namespace requirement: relayhistory and relay-cloud-api below call
# http://relayauth.relayauth.svc:8787 from this namespace. If the RelayAuth
# release in the relayauth namespace runs with networkPolicy.enabled, its
# default ingressFrom admits same-namespace pods only and these calls are
# dropped. That release must admit this namespace, for example:
#   networkPolicy:
#     ingressFrom:
#       - podSelector: {}
#       - namespaceSelector:
#           matchLabels: { kubernetes.io/metadata.name: agent-relay }
components:
  relayauth: false
  sessionsPipeline: false

relayhistory:
  image:
    digest: sha256:8fbda9bd89dd33994b6b3331fb403c38a25f04e6742050bd717e99661f3544ba
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { memory: 512Mi }
  relayauth:
    jwksUrl: http://relayauth.relayauth.svc:8787/.well-known/jwks.json
    issuer: http://relayauth.relayauth.svc:8787

relay-cloud-api:
  image:
    digest: sha256:6942f8ede4f69ea7db0b2defdabf1ad04217ad6b6e275084126c1c6ab7f84ce3
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { memory: 512Mi }
  services:
    relayauthUrl: http://relayauth.relayauth.svc:8787
  # The proof cluster's shared Cloud SQL database grants runtime access to the
  # role the Sessions stack created; control_api_runtime does not exist there.
  database:
    runtimeRole: bulls96_runtime

relay-dashboard:
  image:
    digest: sha256:720ae773f2200afcf2512818cc45969b841d8330aec796482c9b4cba51aa5463
