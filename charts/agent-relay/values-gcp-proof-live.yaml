# Existing proof-cluster overlay. Apply after values-gcp-proof.yaml.
# RelayAuth and the Sessions Pipeline already run in their own namespaces.
# The exposed components inherit the proof profile's GKE load-balancer
# NetworkPolicy rules.
#
# Cross-namespace requirement: relayhistory and relay-cloud-api below call
# http://relayauth.relayauth.svc:8787 from this namespace. If the RelayAuth
# release in the relayauth namespace runs with networkPolicy.enabled, its
# default ingressFrom admits same-namespace pods only and these calls are
# dropped. That release must admit this namespace, for example:
#   networkPolicy:
#     ingressFrom:
#       - podSelector: {}
#       - namespaceSelector:
#           matchLabels: { kubernetes.io/metadata.name: agent-relay }
components:
  relayauth: false
  sessionsPipeline: false

relayhistory:
  image:
    # Erasure-fix proof build of relayhistory-cloud 3cb76752 (experimental;
    # branch proof/erasure-turns-on-4b5839f). Its 0074 arms the write hold:
    # upgrade with the two-step drain in charts/relayhistory/README.md.
    digest: sha256:f36ae1671bdcd88a2b8b2df62c8edecb1381237d9f968747b39298959ad33563
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { memory: 512Mi }
  relayauth:
    jwksUrl: http://relayauth.relayauth.svc:8787/.well-known/jwks.json
    issuer: http://relayauth.relayauth.svc:8787

relay-cloud-api:
  image:
    # Proof build of AgentWorkforce/relaycontrol 17bdc78 (selfhost/desktop-auth).
    # Proof-only: not in self-hosted/customer-images.yaml, which audits the
    # customer profile (values-gcp.yaml) for the release gate.
    digest: sha256:99670d253b88c27499f6c4cca6ac1265ed97978ed7a9d5eaaeecd65de9e052dc
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { memory: 512Mi }
  services:
    relayauthUrl: http://relayauth.relayauth.svc:8787
  # The live data is encrypted under this key id (set by hand on the
  # deployment before the chart rendered it).
  encryption:
    keyId: proof-1
  # The dashboard is on the root host, not the api host.
  dashboardUrl: https://gcp-proof.agentrelay.com/
  # Key in Secret agent-relay-gcp-proof; enables /internal/v1 (flows env
  # delivery). The api host denies /internal at the edge.
  secretKeys:
    internalToken: selfhost-internal-token
  # The proof has no telemetry install key: keep telemetry off explicitly.
  telemetry:
    level: "off"
  # The proof cluster's shared Cloud SQL database grants runtime access to the
  # role the Sessions stack created; control_api_runtime does not exist there.
  database:
    runtimeRole: bulls96_runtime

relay-dashboard:
  image:
    # Proof build of AgentWorkforce/relay-dashboard 53d484b
    # (selfhost/device-approval; the self-host build served at /). Proof-only.
    digest: sha256:23361e08b899f272ed5debcbd4e7d6c6555591029357d6fba6c54236063bca62
