apiVersion: v2
name: agent-relay
description: Self-hosted Agent Relay messaging and sessions suite
type: application
version: 0.3.8
appVersion: "0.1.0"
kubeVersion: ">=1.28.0-0"
annotations:
  artifacthub.io/license: Apache-2.0
  agentworkforce.dev/license-scope: "First-party chart code only; dependencies and images retain their own licenses."
  # Templates use {{ continue }} (Helm 3.10+).
  agentworkforce.dev/min-helm-version: "3.10.0"
home: https://github.com/AgentWorkforce/helm-charts
keywords: [agent-relay, messaging, sessions, self-hosted]
maintainers:
  - name: AgentWorkforce
    url: https://github.com/AgentWorkforce
dependencies:
  - name: relaycast
    version: 0.3.3
    repository: file://../relaycast
    condition: components.relaycast
  - name: relayauth
    version: 0.1.3
    repository: file://../relayauth
    condition: components.relayauth
  - name: sessions-pipeline
    version: 0.6.0
    repository: file://../sessions-pipeline
    condition: components.sessionsPipeline
  - name: relayhistory
    version: 0.1.1
    repository: file://../relayhistory
    condition: components.relayhistory
  - name: relay-cloud-api
    version: 0.2.4
    repository: file://../relay-cloud-api
    condition: components.cloudApi
  - name: relay-dashboard
    version: 0.1.3
    repository: file://../relay-dashboard
    condition: components.dashboard
  - name: relayflows
    version: 0.2.4
    repository: file://../relayflows
    condition: components.relayflows
  # Vendored upstream TerseAI chart (charts/durable-actors/UPSTREAM.md); its
  # values key is `durable-actors` and its Service is <release>-durable-actors.
  - name: durable-actors
    version: 0.14.6
    repository: file://../durable-actors
    condition: components.durableActors
  - name: relayfile
    version: 0.2.0
    repository: file://../relayfile
    condition: components.relayfile
