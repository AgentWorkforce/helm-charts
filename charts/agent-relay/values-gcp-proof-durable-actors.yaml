# durable-actors overlay for the GKE proof (awf-conformance-gke,
# project agentrelay-96bulls-soc2-2610, release agent-relay in namespace
# agent-relay). Apply after values-gcp-proof.yaml and values-gcp-proof-live.yaml:
#
#   helm upgrade --install agent-relay charts/agent-relay -n agent-relay \
#     -f values-gcp-proof.yaml -f values-gcp-proof-live.yaml \
#     -f values-gcp-proof-durable-actors.yaml \
#     --set relaycast.runtime.durableActors.gateway.image.digest=sha256:<gateway> \
#     --set relaycast.runtime.durableActors.deployer.image.digest=sha256:<deployer> \
#     --set relayfile.runtime.durableActors.image.digest=sha256:<relayfile-actors>
#
# It switches Relaycast to runtime.backend=durable-actors (a FRESH-INSTALL
# backend: SQLite workspaces are not migrated, and only ar_ credentials work),
# adds Relayfile in durable-actors mode, and runs the durable-actors control
# plane with actor sandboxes on the gvisor-pool node pool. The GCP resources and
# Secrets it names are listed in docs/self-hosted-durable-actors.md
# ("GCP provisioning"). No credential values appear here.
components:
  durableActors: true
  relayfile: true

gkeIngress:
  hosts:
    actors: actors.gcp-proof.agentrelay.com
    files: files.gcp-proof.agentrelay.com

durable-actors:
  publicUrl: https://actors.gcp-proof.agentrelay.com
  placement:
    # The zone of the gvisor-pool node pool.
    zone: us-central1-a
  storage:
    # One Standard bucket (ownership, compiled code, state snapshots).
    bucket: agentrelay-96bulls-soc2-2610-actors
  # Keys: postgres-url, jwt-signing-key, api-key. One controller needs no Redis.
  credentialsSecret: actors-credentials
  serviceAccount:
    googleServiceAccount: durable-actors@agentrelay-96bulls-soc2-2610.iam.gserviceaccount.com
  # The umbrella Ingress (gkeIngress.hosts.actors) is the only edge.
  ingress:
    enabled: false
  replicaCount: 1
  actors:
    # Sized for the single e2-standard-4 gvisor-pool node.
    warm: 2
    maxStarting: 4
    cpuMillis: 250
    memoryMiB: 256
  organizationLimits:
    maxActiveActors: 50
  # The Sessions stack's Cloud SQL proxy (96bulls namespace) holds the pool.
  postgres:
    maxConnections: 4

relaycast:
  credentials:
    format: ar
    authority: self
  secretKeys:
    credentialKeyring: relaycast-credential-keyring
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: relaycast-files@agentrelay-96bulls-soc2-2610.iam.gserviceaccount.com
  runtime:
    backend: durable-actors
    durableActors:
      gateway:
        image:
          repository: us-central1-docker.pkg.dev/agentrelay-96bulls-soc2-2610/awf-conformance-images/relaycast-actors-gateway
        replicaCount: 2
      # A copy of actors-credentials/api-key until upstream ships an
      # invoke-only key (then: scope invoke-only, same Secret name).
      invocationSecret:
        name: relaycast-durable-actors-invoke
        key: durable-actors-invoke-key
        scope: admin
      adminKeySecret:
        name: actors-credentials
        key: api-key
      deployer:
        image:
          repository: us-central1-docker.pkg.dev/agentrelay-96bulls-soc2-2610/awf-conformance-images/relaycast-actors-deployer
        artifactBucket: agentrelay-96bulls-soc2-2610-actors
        serviceAccount:
          annotations:
            iam.gke.io/gcp-service-account: actors-deployer@agentrelay-96bulls-soc2-2610.iam.gserviceaccount.com
      # In the sandbox namespace agent-relay-agent-relay, labelled
      # terse.ai/customer-secret=true.
      actorEnvSecrets: [relaycast-actor-env]
      fileSigningSecretKey: relaycast-file-signing-secret
      fileStore:
        driver: gcs
        bucket: agentrelay-96bulls-soc2-2610-relaycast-files

relayfile:
  fullnameOverride: relayfile
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: relayfile@agentrelay-96bulls-soc2-2610.iam.gserviceaccount.com
  service:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
  auth:
    jwksUrl: http://relayauth.relayauth.svc:8787/.well-known/jwks.json
  networkPolicy:
    enabled: true
    # GKE load balancer health checks and proxies reach the gateway.
    allowExternalTraffic: true
  runtime:
    backend: durable-actors
    durableActors:
      image:
        repository: us-central1-docker.pkg.dev/agentrelay-96bulls-soc2-2610/awf-conformance-images/relayfile-actors
      existingSecret: relayfile-actors
      adminKeySecret:
        name: actors-credentials
        key: api-key
      gateway:
        replicaCount: 2
      deployer:
        artifactBucket: agentrelay-96bulls-soc2-2610-actors
        serviceAccount:
          annotations:
            iam.gke.io/gcp-service-account: actors-deployer@agentrelay-96bulls-soc2-2610.iam.gserviceaccount.com
      blobStore:
        driver: gcs
        bucket: agentrelay-96bulls-soc2-2610-relayfile
